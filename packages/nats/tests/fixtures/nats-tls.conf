# NATS server with mutual TLS, used by the TLS e2e tests.
jetstream {}
http: 8222

tls {
  cert_file: "/certs/server-cert.pem"
  key_file: "/certs/server-key.pem"
  ca_file: "/certs/ca.pem"
  verify: true
  timeout: 5
  # TLS-first: negotiate TLS at connect (matches the client's tls:// path) instead of
  # the plaintext-INFO-then-STARTTLS-upgrade default, which the stream transport can't do.
  handshake_first: true
}
