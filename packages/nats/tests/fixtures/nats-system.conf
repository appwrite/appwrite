# NATS server with a system account, used by the server-initiated close e2e test
# to send lame-duck INFO and kick individual client connections.
jetstream {}
http: 8222

accounts {
  APP { jetstream: enabled, users: [{user: app, password: app}] }
  SYS { users: [{user: sys, password: sys}] }
}
system_account: SYS
no_auth_user: app
