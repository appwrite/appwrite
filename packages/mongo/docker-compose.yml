services:

  # The e2e suites reach MongoDB by its service name, so tests/e2e.sh runs them
  # here, on the compose network, with the package and the root toolchain mounted.
  tests:
    container_name: utopia-mongo-test-1
    image: appwrite/base:2.1.0
    entrypoint: ["tail", "-f", "/dev/null"]
    networks:
      - database
    volumes:
      - ./:/usr/src/code
      # phpunit comes from the root toolchain, as on the host
      - ../../vendor:/usr/src/toolchain:ro
    working_dir: /usr/src/code

  mongo:
    image: mongo:8
    container_name: utopia-mongo-1
    networks:
      - database
    ports:
      - "8881:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: example
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

networks:
  database:
