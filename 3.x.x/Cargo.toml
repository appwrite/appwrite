bytes = "1"
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1"] }
http-body-util = "0.1"
flate2 = "1"
brotli = "7"
zstd = "0.13"
sha1 = "0.10"
sha2 = "0.10"
md-5 = "0.10"
md5 = "0.7"
hex = "0.4"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "blocking"] }
quick-xml = "0.36"
fs2 = "0.4"
parking_lot = "0.12"
once_cell = "1"
url = "2"
regex = "1"
async-trait = "0.1"
futures = "0.3"
pin-project-lite = "0.2"
tracing = "0.1"
anyhow = "1"
tempfile = "3"
tikv-jemallocator = "0.6"
socket2 = { version = "0.5", features = ["all"] }
# Pinned for workspace CI toolchain / MSRV 1.97.
image = { version = "=0.25.6", default-features = false, features = ["jpeg", "png", "gif", "webp", "rayon"] }
fast_image_resize = { version = "=4.2.1", features = ["image"] }
kamadak-exif = "=0.5.5"
webp = { version = "=0.2.6", default-features = false }
# libheif-rs 0.22 matches system libheif 1.17 (Ubuntu 24.04); 1.x needs libheif ≥1.18.
# default-features off avoids bindgen (uses packaged bindings + pkg-config).
libheif-rs = { version = "=0.22.0", default-features = false }
turbojpeg = "1.1.1"
rayon = "1"
rand = "0.8"
subtle = "2"
base64 = "0.22"
hmac = "0.12"
argon2 = "0.5"
bcrypt = "0.16"
aes-gcm = "0.10"
jsonwebtoken = "9"
rsa = { version = "0.9", features = ["sha2", "pem"] }
time = "0.3"
redis = { version = "0.27", features = ["script", "cluster"] }
crc32fast = "1"
async-nats = "0.38"
indexmap = { version = "2.2", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
] }
rustls = { version = "0.23", default-features = false, features = [
    "std",
    "tls12",
    "ring",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "tls12",
    "ring",
] }
rustls-pemfile = "2"
rustls-pki-types = "1"
idna = "1"
hickory-resolver = "0.24"
moka = { version = "0.12", features = ["future", "sync"] }
ipnet = "2"
dashmap = "6"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "hostname",
    "rustls-tls",
] }
# psm 0.1.31+ build-depends on ar_archive_writer; keep pin for MSRV 1.97.
psm = "=0.1.21"
chrono = { version = "0.4.38", default-features = false, features = ["clock", "std"] }
# Optional SQL / Mongo drivers. Pinned for workspace CI / MSRV 1.97.
rusqlite = { version = "0.31", features = ["bundled"] }
mysql = "24"
postgres = { version = "0.19", features = ["with-serde_json-1", "with-chrono-0_4"] }
mongodb = { version = "2.8", default-features = false, features = ["sync"] }
# OpenTelemetry 0.31 matches workspace MSRV 1.97 and reqwest 0.12 (0.32 pulls reqwest 0.13).
opentelemetry = { version = "0.31", default-features = false, features = ["metrics"] }
opentelemetry_sdk = { version = "0.31", default-features = false, features = ["metrics"] }
opentelemetry-otlp = { version = "0.31", default-features = false, features = ["http-proto", "metrics"] }
opentelemetry-http = { version = "0.31", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Inherited by every crate via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# Private modules often expose `pub` items for sibling modules - idiomatic Rust.
unreachable_pub = "allow"
unused_lifetimes = "warn"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Noisy / stylistic pedantic lints we intentionally allow.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
items_after_statements = "allow"
redundant_closure_for_method_calls = "allow"
unused_self = "allow"
# Numeric casts are common and intentional in validators / system helpers.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Keep PHP-port APIs free to evolve without false-positive churn.
manual_let_else = "allow"
option_if_let_else = "allow"
needless_pass_by_value = "allow"
# Newly noisy on Clippy 1.97 (current stable). Mechanical rewrites, not behavior bugs.
map_unwrap_or = "allow"
struct_field_names = "allow"
io_other_error = "allow"
unnested_or_patterns = "allow"
result_large_err = "allow"
ignore_without_reason = "allow"
duration_suboptimal_units = "allow"
unnecessary_sort_by = "allow"
derivable_impls = "allow"
manual_contains = "allow"
collapsible_match = "allow"
explicit_counter_loop = "allow"
question_mark = "allow"
doc_markdown = "allow"
useless_borrows_in_formatting = "allow"
unchecked_time_subtraction = "allow"
implicit_clone = "allow"
self_only_used_in_recursion = "allow"
if_not_else = "allow"
large_enum_variant = "allow"
manual_checked_ops = "allow"
decimal_bitwise_operands = "allow"
cloned_ref_to_slice_refs = "allow"
manual_is_multiple_of = "allow"
incompatible_msrv = "allow"
non_std_lazy_statics = "allow"
unnecessary_map_or = "allow"
borrow_as_ptr = "allow"
manual_repeat_n = "allow"
ptr_as_ptr = "allow"
nonminimal_bool = "allow"
manual_is_variant_and = "allow"
