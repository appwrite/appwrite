[package]
name = "utopia-migration"
description = "Project migration sources and destinations for Utopia (Rust port of utopia-php/migration)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["migration", "appwrite", "utopia"]
categories = ["web-programming", "database"]

[dependencies]
chrono = { workspace = true }
indexmap = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
utopia-cache = { workspace = true }
utopia-database = { workspace = true }
utopia-dsn = { workspace = true }
utopia-storage = { workspace = true }
utopia-validators = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
utopia-test-wiremock = { workspace = true }

[features]
default = []
appwrite-http = []

[[bench]]
name = "migration_run"
harness = false

[lints]
workspace = true
