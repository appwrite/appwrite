[package]
name = "appwrite-platform"
description = "Appwrite platform composition layer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["appwrite", "platform"]
categories = ["web-programming"]

[features]
default = ["memory", "postgres", "mysql", "mongo"]
memory = []
postgres = ["utopia-database/postgres"]
mysql = ["utopia-database/mysql"]
mongo = ["utopia-database/mongo"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
utopia-platform = { workspace = true, features = ["http"] }
utopia-http = { workspace = true }
utopia-di = { workspace = true }
utopia-validators = { workspace = true }
utopia-database = { workspace = true, features = ["postgres", "mysql", "mongo"] }
utopia-cache = { workspace = true }
utopia-auth = { workspace = true }
utopia-emails = { workspace = true }
utopia-servers = { workspace = true }
appwrite-exception = { workspace = true }
appwrite-hooks = { workspace = true }
appwrite-locale = { workspace = true }
appwrite-auth = { workspace = true }
appwrite-event = { workspace = true }
appwrite-response = { workspace = true }
appwrite-database = { workspace = true }
chrono = { workspace = true }
jsonwebtoken = { workspace = true }
rand = { workspace = true }
parking_lot = { workspace = true }
once_cell = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[[bench]]
name = "smoke"
harness = false

[lints]
workspace = true
