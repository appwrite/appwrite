# A stand-in for the public recursive resolver, used by the Proxy DNS
# verification tests to verify customer domains. Mirrors deploy/dns-mock in
# appwrite-labs/cloud.
#
# Unbound rather than CoreDNS because a recursive resolver is what the app
# thinks it is talking to: overrides are one `local-data` line per record
# (every RR type, no regex templates), and forwarding is the server's own job
# rather than a catch-all bolted inside an authoritative zone.
#
#   zones.conf    - the fake public zones.
#   forward.conf  - where every other query goes.

server:
  interface: 0.0.0.0
  port: 53
  do-ip6: no
  access-control: 0.0.0.0/0 allow
  # Test fixture: log what was asked, and never cache a stale answer between
  # test cases.
  verbosity: 1
  log-queries: yes
  cache-max-ttl: 60
  cache-min-ttl: 0
  # No `private-address` entries: the fake zones answer with reserved addresses
  # on purpose, and the forwarder resolves compose service names to private
  # IPs. Configuring any private range here would strip both as rebinding
  # attacks.
  #
  # No DNSSEC either: the fake zones are unsigned, and validating the upstream
  # chain would only add a network dependency to a fixture.
  val-permissive-mode: yes

  include: "/mnt/resources/zones.conf"

include: "/mnt/resources/forward.conf"
