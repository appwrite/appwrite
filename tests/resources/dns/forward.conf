# Everything outside the fake zones goes to Docker's embedded DNS, so compose
# service names resolve, with a public resolver as fallback for external names.

server:
  # 127.0.0.11 is loopback inside this container; unbound refuses loopback
  # upstreams unless told otherwise.
  do-not-query-localhost: no

forward-zone:
  name: "."
  forward-addr: 127.0.0.11
  forward-addr: 1.1.1.1
