# Fake public zones for the Proxy DNS verification tests. One line per record,
# so a case is added by adding the record it needs.
#
# Each test run prefixes its fixture hostnames with a unique label, so every
# fixture is a `redirect` zone: any name under it answers with the zone's own
# records. `static` zones answer only exact names; anything else under them is
# NXDOMAIN without a network round trip.
#
# Every zone that can answer negatively carries an SOA. utopia-php/dns rejects
# an authoritative negative answer (NXDOMAIN or NODATA) without an SOA in the
# authority section, and unbound only adds one when the zone defines it. CNAME
# zones cannot hold an SOA (a CNAME may not coexist with other data) and do not
# need one: every query type gets the CNAME, and the negative answer comes from
# the chased target's zone.

local-zone: "webapp.com." static
local-data: "webapp.com. 60 IN SOA ns.webapp.com. hostmaster.webapp.com. 1 3600 600 86400 60"
local-data: "webapp.com. 60 IN A 203.0.0.1"

# CNAME fixtures pointing at the configured platform targets.
local-zone: "stage.webapp.com." redirect
local-data: "stage.webapp.com. 60 IN CNAME cname.localhost."

local-zone: "stage-site.webapp.com." redirect
local-data: "stage-site.webapp.com. 60 IN CNAME sites.localhost."

local-zone: "stage-function.webapp.com." redirect
local-data: "stage-function.webapp.com. 60 IN CNAME cname.localhost."

# Verification must reject a CNAME pointing somewhere else.
local-zone: "stage-wrong-cname.webapp.com." redirect
local-data: "stage-wrong-cname.webapp.com. 60 IN CNAME cname-wrong.localhost."

# An A record matching the expected target.
local-zone: "correct-a.webapp.com." redirect
local-data: "correct-a.webapp.com. 60 IN SOA ns.webapp.com. hostmaster.webapp.com. 1 3600 600 86400 60"
local-data: "correct-a.webapp.com. 60 IN A 203.0.0.1"

# CAA pair: one issuer the platform is not allowed to use, one it is.
local-zone: "stage-wrong-caa.webapp.com." redirect
local-data: "stage-wrong-caa.webapp.com. 60 IN SOA ns.webapp.com. hostmaster.webapp.com. 1 3600 600 86400 60"
local-data: "stage-wrong-caa.webapp.com. 60 IN A 203.0.0.1"
local-data: 'stage-wrong-caa.webapp.com. 60 IN CAA 0 issue "unknown-issuer.org"'

local-zone: "stage-correct-caa.webapp.com." redirect
local-data: "stage-correct-caa.webapp.com. 60 IN SOA ns.webapp.com. hostmaster.webapp.com. 1 3600 600 86400 60"
local-data: "stage-correct-caa.webapp.com. 60 IN A 203.0.0.1"
local-data: 'stage-correct-caa.webapp.com. 60 IN CAA 0 issue "digicert.com"'

# An A record that does not match the expected target.
local-zone: "wrong-a-webapp.com." redirect
local-data: "wrong-a-webapp.com. 60 IN SOA ns.wrong-a-webapp.com. hostmaster.wrong-a-webapp.com. 1 3600 600 86400 60"
local-data: "wrong-a-webapp.com. 60 IN A 203.0.0.5"

# The platform targets the fixtures point at live under localhost. When a
# fixture answers with a CNAME, unbound chases the target through its resolver
# path, which skips local-zone data and would otherwise ask the forwarder. The
# runner's Docker DNS answers any *.localhost with 127.0.0.1 and ::1, and ::1
# is _APP_DOMAIN_TARGET_AAAA, so a wrong CNAME would verify. An auth-zone is
# consulted by that path: the empty zone makes every target NXDOMAIN with an
# SOA, locally.
auth-zone:
  name: "localhost."
  zonefile: "/mnt/resources/localhost.zone"
  for-downstream: yes
  for-upstream: yes
  fallback-enabled: no
