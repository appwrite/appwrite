  appwrite-worker:
    entrypoint: worker
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "5"
        max-size: 10m
    container_name: appwrite-worker
    image: ${_APP_IMAGE:-appwrite/appwrite}:${_APP_VERSION:-latest}
    networks:
      - appwrite
    depends_on:
      - redis
      - ${_APP_DB_HOST:-postgresql}
