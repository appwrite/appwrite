services:
  tests:
    container_name: agents-tests
    image: agents-dev
    build:
      context: .
    volumes:
      - ./src:/usr/src/code/src
      - ./tests:/usr/src/code/tests
      - ./phpunit.xml:/usr/src/code/phpunit.xml
    environment:
      - LLM_KEY_ANTHROPIC=${LLM_KEY_ANTHROPIC:-}
      - LLM_KEY_OPENAI=${LLM_KEY_OPENAI:-}
      - LLM_KEY_DEEPSEEK=${LLM_KEY_DEEPSEEK:-}
      - LLM_KEY_XAI=${LLM_KEY_XAI:-}
      - LLM_KEY_PERPLEXITY=${LLM_KEY_PERPLEXITY:-}
      - LLM_KEY_GEMINI=${LLM_KEY_GEMINI:-}
      - LLM_KEY_OPENROUTER=${LLM_KEY_OPENROUTER:-}
    depends_on:
      - ollama
    networks:
      - utopia

  ollama:
    build:
      context: .
      dockerfile: ollama.dockerfile
      args:
        MODELS: "embeddinggemma"
    container_name: ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    # persistent for caching models across restarts and preloading
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - utopia

  appwrite-embedding:
    image: appwrite/embedding
    environment:
      EMBEDDING_MODELS: "nomic"
    container_name: appwrite-embedding
    ports:
      - "11430:11434"
    restart: unless-stopped
    # persistent for caching models across restarts and preloading
    volumes:
      - embedding_models:/home/embedder/models
    networks:
      - utopia

volumes:
  ollama_models:
  embedding_models:

networks:
  utopia:
