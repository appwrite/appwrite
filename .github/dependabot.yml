version: 2
updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      composer-version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      composer-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: bun
    directories:
      - "/"
      - "/apps/console"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      bun-version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      bun-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - "/"
      - "/apps/console"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      docker-version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      docker-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore"
      include: scope
    groups:
      github-actions-version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - "*"
      github-actions-security-updates:
        applies-to: security-updates
        patterns:
          - "*"
