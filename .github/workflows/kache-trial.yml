# Temporary: measures kache (https://github.com/kunobi-ninja/kache) on the extension's Rust builds
# before deciding whether CI and the Dockerfile use it. Removed once measured.
name: kache trial

on:
  pull_request:
    paths:
      - .github/workflows/kache-trial.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kache-trial-${{ github.ref }}
  cancel-in-progress: true

env:
  KACHE_VERSION: v2.3.1
  KACHE_SHA256: 6f1ff3f9faf5a9bb0e38501c5bfe9ab5b4a980834f1c835d09ad5b0fdf9b6ab9
  MID: crates/utopia/compression/src/lib.rs
  TOP: crates/extension/src/lib.rs

jobs:
  trial:
    name: ${{ matrix.wrapper }}
    # The runner CI's Packages / Extension job builds on.
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && format('gcrunner={0}-kache-{1}/runner=standard', github.run_id, matrix.wrapper)
      || 'ubuntu-24.04' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        wrapper: [baseline, kache]
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install build dependencies and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev libheif-dev pkg-config
          rustup toolchain install
          rustup component add clippy
          cargo fetch --locked

      - name: Install kache
        if: matrix.wrapper == 'kache'
        run: |
          curl -fsSL -o kache.tar.gz "https://github.com/kunobi-ninja/kache/releases/download/${KACHE_VERSION}/kache-x86_64-unknown-linux-musl.tar.gz"
          echo "${KACHE_SHA256}  kache.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf kache.tar.gz -C "$HOME/.local/bin" kache kache-engine
          rm kache.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          {
            echo "RUSTC_WRAPPER=kache"
            echo "KACHE_LOCAL_ONLY=true"
            echo "KACHE_CACHE_DIR=$RUNNER_TEMP/kache"
          } >> "$GITHUB_ENV"

      - name: Measure
        shell: bash
        run: |
          set -euo pipefail
          summary=$GITHUB_STEP_SUMMARY
          echo "## ${{ matrix.wrapper }} ($(nproc) CPUs)" >> "$summary"
          echo "| Run | Seconds |" >> "$summary"
          echo "| --- | ---: |" >> "$summary"
          edit() { printf '\n#[allow(dead_code)]\nfn kache_trial_edit_%s() {}\n' "$(date +%s%N)" >> "$1"; }
          # Every run starts from an empty target/, as a docker build or a fresh CI job does.
          run() {
            local label=$1; shift
            rm -rf target
            local start=$(date +%s.%N)
            "$@"
            local end=$(date +%s.%N)
            printf '| %s | %.0f |\n' "$label" "$(echo "$end - $start" | bc)" >> "$summary"
          }
          release() { cargo build --release --locked -p utopia-extension; }
          checks() {
            cargo clippy --workspace --all-targets --all-features --locked -- -D warnings &&
            cargo test --locked --workspace --exclude utopia-extension --all-features --no-run
          }
          run "release, cold" release
          run "release, same source again" release
          edit "$MID"; run "release, after a change in utopia-compression" release
          edit "$TOP"; run "release, after a change in the extension crate" release
          git checkout -- crates
          run "clippy + test build, cold" checks
          edit "$MID"; run "clippy + test build, after a change in utopia-compression" checks
          if command -v kache > /dev/null; then
            echo '```' >> "$summary"
            kache stats >> "$summary" 2>&1 || true
            echo '```' >> "$summary"
          fi
