name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-assets:
    name: Static asset publishing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - run: bash -n .github/scripts/extract-assets.sh

  build:
    name: Build
    runs-on: runs-on=${{ github.run_id }}/runner=checks
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Check connect snippet line width
        run: bun run lint:snippets

      - name: Build
        run: bun run build
        env:
          VITE_APPWRITE_ENDPOINT: http://appwrite.test/v1
          PUBLIC_APPWRITE_ENDPOINT: http://appwrite.test/v1
