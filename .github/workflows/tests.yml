name: "Tests"

on: [pull_request]
jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-versions: [
          '8.2',
          '8.3'
        ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          submodules: recursive

      - run: git checkout HEAD^2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: php-${{ matrix.php-versions }}.Dockerfile
          push: false
          tags: mqtt-${{ matrix.php-versions }}-dev
          load: true
          cache-from: type=gha,scope=${{ matrix.php-versions }}
          cache-to: type=gha,mode=max,scope=${{ matrix.php-versions }}

      - name: Start Containers
        run: |
          export PHP_VERSION=${{ matrix.php-versions }}
          docker compose up -d
          sleep 10

      - name: Run unit tests
        run: docker compose exec tests vendor/bin/phpunit --testsuite Unit

      - name: Run e2e tests
        run: docker compose exec tests vendor/bin/phpunit --testsuite E2E
