name: Production deployment

on:
    workflow_dispatch:
    release:
        types: [published]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: false

env:
    ENVIRONMENT: production
    PROJECT: assets
    APPLICATION: console
    DECLARATIVE_OWNER: appwrite-labs
    DECLARATIVE_REPOSITORY: application-configuration
    REGISTRY_GITHUB: ghcr.io
    REGISTRY_DOCKERHUB: docker.io
    IMAGE_NAME: appwrite/new
    TAG: ${{ github.event.release.tag_name || github.sha }}

jobs:
    image:
        # Promote the immutable image tag from a successful staging deployment.
        runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/family=c7/extras=otel
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
            packages: read
        outputs:
            digest_amd64: ${{ steps.image.outputs.digest_amd64 }}
            digest_arm64: ${{ steps.image.outputs.digest_arm64 }}
        steps:
            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ${{ env.REGISTRY_GITHUB }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Resolve the staging image for this release commit
              id: image
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
                  SOURCE_SHA: ${{ github.sha }}
              run: |
                  run=$(gh api "repos/$GH_REPO/actions/workflows/staging.yml/runs?head_sha=$SOURCE_SHA&status=success&per_page=1" \
                    --jq '.workflow_runs[0] | select(. != null) | "\(.id)-\(.run_attempt)"')
                  if [[ ! "$run" =~ ^[0-9]+-[0-9]+$ ]]; then
                    echo "Release commit must have a successful staging deployment first" >&2
                    exit 1
                  fi
                  docker buildx imagetools inspect --raw "$REGISTRY_GITHUB/$IMAGE_NAME:build-$run" > manifest.json
                  for arch in amd64 arm64; do
                    digest=$(jq -er --arg arch "$arch" '[.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch)] | if length == 1 then .[0].digest else error("Expected one image per architecture") end' manifest.json)
                    [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
                    echo "digest_$arch=$digest" >> "$GITHUB_OUTPUT"
                  done

    manifest:
        needs: image
        runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/family=c7/extras=otel
        timeout-minutes: 10
        steps:
            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ${{ env.REGISTRY_GITHUB }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Login to Docker Hub
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ${{ env.REGISTRY_DOCKERHUB }}
                  username: ${{ secrets.DOCKERHUB_USERNAME }}
                  password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Tag the per-arch digests as one multi-arch manifest
              # Digests are content-addressed, so the same pair is valid in both
              # registries.
              env:
                  DIGESTS: ${{ needs.image.outputs.digest_amd64 }} ${{ needs.image.outputs.digest_arm64 }}
              run: |
                  for registry in "$REGISTRY_GITHUB" "$REGISTRY_DOCKERHUB"; do
                    refs=()
                    for digest in $DIGESTS; do
                      refs+=("$registry/$IMAGE_NAME@$digest")
                    done
                    docker buildx imagetools create --tag "$registry/$IMAGE_NAME:$TAG" "${refs[@]}"
                    docker buildx imagetools inspect "$registry/$IMAGE_NAME:$TAG"
                  done

    publish-assets:
        needs: image
        runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/family=c7/extras=otel
        timeout-minutes: 25
        permissions:
            contents: read
            packages: read
        steps:
            - name: Checkout the repo
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

            - name: Login to GitHub Container Registry
              uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
              with:
                  registry: ${{ env.REGISTRY_GITHUB }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract the deployed images' client assets
              env:
                  DIGEST_AMD64: ${{ needs.image.outputs.digest_amd64 }}
                  DIGEST_ARM64: ${{ needs.image.outputs.digest_arm64 }}
              run: bash .github/scripts/extract-assets.sh

            - name: Publish assets to R2
              uses: docker://rclone/rclone@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5 # 1.75.1
              with:
                  entrypoint: /bin/sh
                  args: .github/scripts/publish-assets.sh
              env:
                  RCLONE_CONFIG_R2_TYPE: s3
                  RCLONE_CONFIG_R2_PROVIDER: Cloudflare
                  RCLONE_CONFIG_R2_ENDPOINT: https://285d5ba7177bab8490e237b619b4b9f6.r2.cloudflarestorage.com
                  RCLONE_CONFIG_R2_REGION: auto
                  RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'
                  RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_PRODUCTION_ACCESS_KEY_ID }}
                  RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_PRODUCTION_SECRET_ACCESS_KEY }}
                  R2_BUCKET: appwrite-console-production

    deploy:
        # Never roll out HTML that references assets which failed to publish.
        needs: [manifest, publish-assets]
        runs-on: runs-on=${{ github.run_id }}/runner=2cpu-linux-x64/family=c7/extras=otel
        timeout-minutes: 10
        # Shared across the staging and production workflows so their deploy
        # jobs never push to application-configuration at the same time.
        concurrency:
            group: declarative-deploy
            cancel-in-progress: false
        steps:
            - name: Get token for ${{ env.DECLARATIVE_REPOSITORY }}
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              with:
                  client-id: ${{ vars.DECLARATIVE_DEPLOYMENT_GITHUB_APP_ID }}
                  private-key: ${{ secrets.DECLARATIVE_DEPLOYMENT_GITHUB_APP_PRIVATE_KEY }}
                  owner: ${{ env.DECLARATIVE_OWNER }}
                  repositories: ${{ env.DECLARATIVE_REPOSITORY }}

            - name: Checkout ${{ env.DECLARATIVE_REPOSITORY }}
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
              with:
                  repository: ${{ env.DECLARATIVE_OWNER }}/${{ env.DECLARATIVE_REPOSITORY }}
                  token: ${{ steps.app-token.outputs.token }}

            - name: Update image reference
              run: yq -i '.global.image.repository = strenv(IMAGE_NAME) | .global.image.tag = strenv(TAG)' ${{ env.PROJECT }}/${{ env.ENVIRONMENT }}/${{ env.APPLICATION }}/default.yaml

            - name: Commit and push
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git add ${{ env.PROJECT }}/${{ env.ENVIRONMENT }}/${{ env.APPLICATION }}/default.yaml
                  if git diff --cached --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "chore(${{ env.ENVIRONMENT }}): ${{ env.APPLICATION }} image to ${{ env.IMAGE_NAME }}:${{ env.TAG }}"
                    git push
                  fi
