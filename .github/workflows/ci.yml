name: CI

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml
  IMAGE: appwrite-dev
  K6_VERSION: '0.53.0'
  DOCKERHUB_AUTH_AVAILABLE: ${{ secrets.DOCKERHUB_TOKEN != '' }}

on:
  pull_request:
  push:
    branches:
      - main
      - 1.9.x
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      response_format:
        description: 'Response format version to test (e.g., 1.5.0, 1.4.0)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  dependencies:
    name: Checks / Dependencies
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: "google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@c51854704019a247608d928f370c98740469d4b5" # v2.3.5

  security:
    name: Checks / Image
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Build the Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: false
          load: true
          tags: pr_image:${{ github.sha }}
          target: production

      - name: Run Trivy vulnerability scanner on image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'pr_image:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-image-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy vulnerability scanner on source code
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          skip-setup-trivy: true

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        if: always() && hashFiles('trivy-image-results.sarif') != ''
        with:
          sarif_file: 'trivy-image-results.sarif'
          category: 'trivy-image'

      - name: Upload source code scan results
        uses: github/codeql-action/upload-sarif@e46ed2cbd01164d986452f91f178727624ae40d7 # v4.35.3
        if: always() && hashFiles('trivy-fs-results.sarif') != ''
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-source'

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup PHP
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # 2.37.0
        with:
          php-version: '8.5'
          extensions: swoole
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Validate composer.json
        run: composer validate

      - name: Install dependencies
        id: install
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      - parallel:
          - name: Install Node dependencies
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: npm ci

          - name: Cache PHPStan result cache
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
            with:
              path: .phpstan-cache
              key: phpstan-${{ github.sha }}
              restore-keys: |
                phpstan-

      - parallel:
          - name: Audit dependencies
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            env:
              COMPOSER_NO_AUDIT: 0
            run: composer audit

          - name: Check PHPUnit matrix behavior
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: node --test tests/tools/matrix.test.cjs

          - name: Run Linter
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: composer lint

          - name: Check Docker Compose formatting
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: npm run lint:compose

          - name: Run Rector
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: composer refactor:check

          - name: Run PHPStan
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: composer analyze -- --no-progress

          - name: Generate specs
            if: ${{ !cancelled() && steps.install.outcome == 'success' }}
            run: _APP_STORAGE_LIMIT=5368709120 php app/cli.php specs --version=latest --git=no

  locale:
    name: Checks / Locale
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Run Locale check
        run: node .github/workflows/static-analysis/locale/index.js

  matrix:
    name: Tests / Matrix
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=60g/spot=price-capacity-optimized/retry=when-interrupted/extras=otel+ecr-cache
    needs: build
    outputs:
      databases: ${{ steps.generate.outputs.databases }}
      modes: ${{ steps.generate.outputs.modes }}
      services: ${{ steps.generate.outputs.services }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read and validate PHPUnit suites from the test image
        id: suites
        run: |
          docker pull "${RUNS_ON_ECR_CACHE}:${IMAGE}-${GITHUB_SHA}"
          suites=$(docker run --rm -v "$PWD/tests:/usr/src/code/tests:ro" -v "$PWD/phpunit.xml:/usr/src/code/phpunit.xml:ro" "${RUNS_ON_ECR_CACHE}:${IMAGE}-${GITHUB_SHA}" php tests/tools/suites.php phpunit.xml)
          echo "names=$suites" >> "$GITHUB_OUTPUT"

      - name: Generate matrix
        id: generate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PHPUNIT_SUITES: ${{ steps.suites.outputs.names }}
        with:
          script: |
            const runner4 = `runs-on=${context.runId}/runner=4cpu-linux-x64/volume=60g/spot=price-capacity-optimized/retry=when-interrupted/extras=otel+ecr-cache`;
            const runner8 = `runs-on=${context.runId}/runner=8cpu-linux-x64/volume=60g/spot=price-capacity-optimized/retry=when-interrupted/extras=otel+ecr-cache`;

            const allNames = JSON.parse(process.env.PHPUNIT_SUITES);
            for (const name of allNames) {
              if (name !== 'unit' && !name.startsWith('e2e-')) throw new Error(`Unassigned suite: ${name}`);
            }
            const names = allNames.filter(name => name.startsWith('e2e-'));
            const overrides = {
              'e2e-databases': { runner: runner8, functional: false, processes: 3, documentsdb: true, embedding: true },
              'e2e-tablesdb': { runner: runner8, functional: false, processes: 3 },
              'e2e-functions': { functional: false },
              'e2e-graphql': { functional: false },
              'e2e-projects': { documentsdb: true },
              'e2e-realtime': { functional: false, documentsdb: true },
              'e2e-projectwebhooks': { functional: false },
              'e2e-vcsgitea': { functional: false },
              'e2e-migrations': { processes: 1, documentsdb: true },
            };
            for (const name of Object.keys(overrides)) {
              if (!names.includes(name)) throw new Error(`Stale suite override: ${name}`);
            }
            const services = names.filter(name => name !== 'e2e-general').map(suite => ({
              name: suite.slice(4), suite, runner: runner4, functional: true, processes: null,
              ...overrides[suite],
            }));
            core.setOutput('services', JSON.stringify(services));

            const pr = context.payload.pull_request;

            const isDatabaseVersionChanged = async () => {
              const getContent = (ref) => github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: 'composer.lock',
                ref,
              });

              const getDbVersion = (lock) => {
                const pkg = lock.packages?.find(p => p.name === 'utopia-php/database');
                return JSON.stringify([pkg?.version, pkg?.source?.reference, pkg?.dist?.reference]);
              };
              const [{ data: base }, { data: head }] = await Promise.all([
                getContent(pr.base.sha),
                getContent(pr.head.sha),
              ]);

              const decode = (content) => JSON.parse(Buffer.from(content, 'base64').toString());
              return getDbVersion(decode(base.content)) !== getDbVersion(decode(head.content));
            };

            const fullMatrix = context.eventName === 'workflow_dispatch' || context.eventName === 'schedule'
              || (pr && await isDatabaseVersionChanged());

            if (fullMatrix) {
              core.setOutput('databases', JSON.stringify(['MariaDB', 'PostgreSQL', 'MongoDB']));
              core.setOutput('modes', JSON.stringify(['dedicated', 'shared']));
              return;
            }

            core.setOutput('databases', JSON.stringify(['PostgreSQL']));
            core.setOutput('modes', JSON.stringify(['dedicated']));

  build:
    name: Build
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=60g/spot=price-capacity-optimized/retry=when-interrupted/extras=otel+s3-cache+ecr-cache
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_AUTH_AVAILABLE == 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build and push Appwrite
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          push: true
          tags: ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }}
          cache-from: type=s3,blobs_prefix=cache/${{ github.repository }}/,manifests_prefix=cache/${{ github.repository }}/,region=${{ env.RUNS_ON_AWS_REGION }},bucket=${{ env.RUNS_ON_S3_BUCKET_CACHE }}
          cache-to: type=s3,blobs_prefix=cache/${{ github.repository }}/,manifests_prefix=cache/${{ github.repository }}/,region=${{ env.RUNS_ON_AWS_REGION }},bucket=${{ env.RUNS_ON_S3_BUCKET_CACHE }},mode=max
          target: development
          build-args: |
            DEBUG=false
            TESTING=true
            VERSION=dev

  unit:
    name: Tests / Unit
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=60g/spot=price-capacity-optimized/retry=when-interrupted/extras=otel+ecr-cache
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROFILES: ''
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_AUTH_AVAILABLE == 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - parallel:
          - name: Pull Docker Image
            run: |
              docker pull ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }}
              docker tag ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }} ${{ env.IMAGE }}

          - name: Pull Docker Compose images
            timeout-minutes: 5
            run: |
              # Docker Hub registry timeouts are a common transient CI failure
              # (e.g. a traefik manifest fetch timing out). Retry the image pull;
              # keep `up` single-shot so genuine container health failures still surface.
              for attempt in 1 2 3; do
                if docker compose pull --quiet --ignore-buildable; then
                  break
                elif [ "$attempt" -eq 3 ]; then
                  echo "::error::docker compose pull failed after 3 attempts; aborting"
                  exit 1
                fi
                echo "::warning::docker compose pull failed (attempt ${attempt}/3); retrying in 15s"
                sleep 15
              done

      - name: Load and Start Appwrite
        timeout-minutes: 5
        run: docker compose up -d --quiet-pull --wait

      - name: Environment Variables
        run: docker compose exec -T appwrite vars

      - name: Run Unit Tests
        timeout-minutes: 15
        run: >-
          docker compose exec
          -e _APP_E2E_RESPONSE_FORMAT="${{ github.event.inputs.response_format }}"
          appwrite test --testsuite unit

  e2e_general:
    name: Tests / E2E / General
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=60g/spot=price-capacity-optimized/retry=when-interrupted/extras=otel+ecr-cache
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      packages: read
    env:
      COMPOSE_PROFILES: ''
    steps:
      - name: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_AUTH_AVAILABLE == 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - parallel:
          - name: Pull Docker Image
            run: |
              docker pull ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }}
              docker tag ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }} ${{ env.IMAGE }}

          - name: Pull Docker Compose images
            timeout-minutes: 5
            run: |
              # Docker Hub registry timeouts are a common transient CI failure
              # (e.g. a traefik manifest fetch timing out). Retry the image pull;
              # keep `up` single-shot so genuine container health failures still surface.
              for attempt in 1 2 3; do
                if docker compose pull --quiet --ignore-buildable; then
                  break
                elif [ "$attempt" -eq 3 ]; then
                  echo "::error::docker compose pull failed after 3 attempts; aborting"
                  exit 1
                fi
                echo "::warning::docker compose pull failed (attempt ${attempt}/3); retrying in 15s"
                sleep 15
              done

      - name: Load and Start Appwrite
        timeout-minutes: 5
        run: docker compose up -d --quiet-pull --wait

      - name: Wait for Open Runtimes
        timeout-minutes: 3
        run: |
          while ! docker logs exc1 | grep -q "Executor is ready."; do
            echo "Waiting for Executor to come online"
            sleep 1
          done

      - name: Run General Tests
        timeout-minutes: 15
        run: >-
          docker compose exec -T
          -e _APP_E2E_RESPONSE_FORMAT="${{ github.event.inputs.response_format }}"
          appwrite test --testsuite e2e-general

      - name: Failure Logs
        if: failure()
        run: |
          echo "=== Appwrite Logs ==="
          docker compose logs --timestamps

  e2e_service:
    name: Tests / E2E / ${{ matrix.database }} (${{ matrix.mode }}) / ${{ matrix.service.name }}
    runs-on: ${{ matrix.service.runner }}
    timeout-minutes: 20
    needs: [build, matrix]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        database: ${{ fromJSON(needs.matrix.outputs.databases) }}
        mode: ${{ fromJSON(needs.matrix.outputs.modes) }}
        service: ${{ fromJSON(needs.matrix.outputs.services) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set environment
        run: |
          echo "_APP_OPTIONS_ROUTER_PROTECTION=enabled" >> $GITHUB_ENV

          # Exercise empty functions-domain entries through the existing Proxy API tests.
          if [ "${{ matrix.service.name }}" = "proxy" ]; then
            echo "_APP_DOMAIN_FUNCTIONS=functions.localhost," >> $GITHUB_ENV
          fi

          if [ "${{ matrix.database }}" = "MariaDB" ]; then
            COMPOSE_PROFILES=mariadb
            echo "_APP_DB_ADAPTER=mariadb" >> $GITHUB_ENV
            echo "_APP_DB_HOST=mariadb" >> $GITHUB_ENV
            echo "_APP_DB_PORT=3306" >> $GITHUB_ENV
          elif [ "${{ matrix.database }}" = "MongoDB" ]; then
            COMPOSE_PROFILES=mongodb
            echo "_APP_DB_ADAPTER=mongodb" >> $GITHUB_ENV
            echo "_APP_DB_HOST=mongodb" >> $GITHUB_ENV
            echo "_APP_DB_PORT=27017" >> $GITHUB_ENV
          elif [ "${{ matrix.database }}" = "PostgreSQL" ]; then
            COMPOSE_PROFILES=postgresql
            echo "_APP_DB_ADAPTER=postgresql" >> $GITHUB_ENV
            echo "_APP_DB_HOST=postgresql" >> $GITHUB_ENV
            echo "_APP_DB_PORT=5432" >> $GITHUB_ENV
          fi

          # DocumentsDB is MongoDB-only, so Mongo runs alongside another primary just for
          # the suites that use it, and in shared tables mode where boot connects every pool.
          if [ "${{ matrix.database }}" != "MongoDB" ] \
            && { [ "${{ matrix.service.documentsdb }}" = "true" ] || [ "${{ matrix.mode }}" = "shared" ]; }; then
            COMPOSE_PROFILES="${COMPOSE_PROFILES},mongodb"
          fi

          # Gitea runs alongside Appwrite only where VCS tests need it.
          if [ "${{ matrix.service.name }}" = "vcsgitea" ]; then
            COMPOSE_PROFILES="${COMPOSE_PROFILES},gitea"
          fi

          # The embedding container is resource-heavy and off by default, so start it and
          # enable the API only for the suites that exercise the embeddings routes.
          if [ "${{ matrix.service.embedding }}" = "true" ]; then
            COMPOSE_PROFILES="${COMPOSE_PROFILES},embedding"
            echo "_APP_EMBEDDING=enabled" >> $GITHUB_ENV
          fi

          echo "COMPOSE_PROFILES=${COMPOSE_PROFILES}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_AUTH_AVAILABLE == 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - parallel:
          - name: Pull Docker Image
            run: |
              docker pull ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }}
              docker tag ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }} ${{ env.IMAGE }}

          - name: Pull Docker Compose images
            timeout-minutes: 5
            run: |
              # Docker Hub registry timeouts are a common transient CI failure
              # (e.g. a traefik manifest fetch timing out). Retry the image pull;
              # keep `up` single-shot so genuine container health failures still surface.
              for attempt in 1 2 3; do
                if docker compose pull --quiet --ignore-buildable; then
                  break
                elif [ "$attempt" -eq 3 ]; then
                  echo "::error::docker compose pull failed after 3 attempts; aborting"
                  exit 1
                fi
                echo "::warning::docker compose pull failed (attempt ${attempt}/3); retrying in 15s"
                sleep 15
              done

      - name: Provision Gitea
        if: matrix.service.name == 'vcsgitea'
        timeout-minutes: 5
        run: |
          docker compose up -d --wait gitea
          docker compose exec -T gitea /setup.sh
          CREDS=$(docker compose exec -T gitea cat /data/gitea/oauth.json)
          CLIENT_SECRET=$(echo "$CREDS" | jq -r .client_secret)
          echo "::add-mask::$CLIENT_SECRET"
          echo "_APP_VCS_GITEA_CLIENT_ID=$(echo "$CREDS" | jq -r .client_id)" >> $GITHUB_ENV
          echo "_APP_VCS_GITEA_CLIENT_SECRET=$CLIENT_SECRET" >> $GITHUB_ENV

      - name: Load and Start Appwrite
        timeout-minutes: 5
        env:
          _APP_BROWSER_HOST: http://invalid-browser/v1
          _APP_DATABASE_SHARED_TABLES: ${{ matrix.mode != 'dedicated' && 'database_db_main' || '' }}
          _APP_DATABASE_DOCUMENTSDB_SHARED_TABLES: ${{ matrix.mode != 'dedicated' && 'documentsdb_db_main' || '' }}
          _APP_DATABASE_VECTORSDB_SHARED_TABLES: ${{ matrix.mode != 'dedicated' && 'vectorsdb_db_main' || '' }}
          _APP_DOCUMENTSDB: enabled
          _APP_VECTORSDB: enabled
        run: docker compose up -d --quiet-pull --wait

      - name: Wait for Open Runtimes
        timeout-minutes: 3
        run: |
          while ! docker logs exc1 | grep -q "Executor is ready."; do
            echo "Waiting for Executor to come online"
            sleep 1
          done

      - name: Test first organization creation
        if: matrix.service.name == 'teams'
        timeout-minutes: 2
        run: |
          # Health/version can respond before the platform schema is initialized.
          while [ "$(docker compose exec -T appwrite curl -s -o /dev/null -w '%{http_code}' -H 'X-Appwrite-Project: console' http://appwrite/v1/account)" != "401" ]; do
            sleep 1
          done
          docker compose exec -T -e _APP_E2E_FRESH_INSTANCE=enabled \
            -e _APP_E2E_RESPONSE_FORMAT="${{ github.event.inputs.response_format }}" \
            appwrite test tests/e2e/Services/Teams/TeamsConsoleClientTest.php --filter=testCreateOrganization

      - name: Run tests
        timeout-minutes: 15
        run: |
          selection=(--testsuite "${{ matrix.service.suite }}" --exclude-group abuseEnabled --exclude-group screenshots --exclude-group antivirus --exclude-group s3)
          docker compose exec -T appwrite vendor/bin/phpunit "${selection[@]}" --list-tests-xml /tmp/expected.xml

          FUNCTIONAL_FLAG=""
          if [ "${{ matrix.service.functional }}" = "true" ]; then
            FUNCTIONAL_FLAG="--functional"
          fi

          PARATEST_PROCESSES="${{ matrix.service.processes }}"
          if [ -z "$PARATEST_PROCESSES" ]; then
            PARATEST_PROCESSES="$(nproc)"
          fi

          docker compose exec -T \
            -e _APP_E2E_RESPONSE_FORMAT="${{ github.event.inputs.response_format }}" \
            -e _TESTS_OAUTH2_GITHUB_CLIENT_ID="${{ secrets.TESTS_OAUTH2_GITHUB_CLIENT_ID }}" \
            -e _TESTS_OAUTH2_GITHUB_CLIENT_SECRET="${{ secrets.TESTS_OAUTH2_GITHUB_CLIENT_SECRET }}" \
            appwrite vendor/bin/paratest --processes "$PARATEST_PROCESSES" $FUNCTIONAL_FLAG "${selection[@]}" --log-junit /tmp/junit.xml
          docker compose exec -T appwrite php tests/tools/results.php /tmp/expected.xml /tmp/junit.xml

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p test-results
          docker compose cp appwrite:/tmp/expected.xml test-results/expected.xml || true
          docker compose cp appwrite:/tmp/junit.xml test-results/junit.xml || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.database }}-${{ matrix.mode }}-${{ matrix.service.name }}
          path: test-results

      - name: Failure Logs
        if: failure()
        run: |
          echo "=== Appwrite Logs ==="
          docker compose logs --timestamps

  e2e_grouped:
    name: Tests / E2E / ${{ matrix.config.label }} (${{ matrix.mode }})
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=60g/spot=price-capacity-optimized/retry=when-interrupted/extras=otel+ecr-cache
    timeout-minutes: 35
    needs: [build, matrix]
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(needs.matrix.outputs.modes) }}
        config:
          - label: Abuse
            group: abuseEnabled
            suite: all
            options_abuse: enabled
            storage_antivirus: disabled
            compose_profiles: ''
            wait: ''
          - label: Screenshots
            group: screenshots
            suite: e2e-sites
            options_abuse: disabled
            storage_antivirus: disabled
            compose_profiles: ''
            wait: executor
          - label: Antivirus
            group: antivirus
            suite: e2e-storage
            options_abuse: disabled
            storage_antivirus: enabled
            compose_profiles: antivirus
            wait: clamav
          - label: S3 Storage
            group: s3
            suite: all
            options_abuse: disabled
            storage_antivirus: disabled
            compose_profiles: s3
            wait: executor
            storage_device: s3
    env:
      # Shared tables mode connects every pool at boot, including the MongoDB-only DocumentsDB.
      COMPOSE_PROFILES: ${{ matrix.mode == 'shared' && format('mongodb,{0}', matrix.config.compose_profiles) || matrix.config.compose_profiles }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_AUTH_AVAILABLE == 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - parallel:
          - name: Pull Docker Image
            run: |
              docker pull ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }}
              docker tag ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }} ${{ env.IMAGE }}

          - name: Pull Docker Compose images
            timeout-minutes: 5
            run: |
              # Docker Hub registry timeouts are a common transient CI failure
              # (e.g. a traefik manifest fetch timing out). Retry the image pull;
              # keep `up` single-shot so genuine container health failures still surface.
              for attempt in 1 2 3; do
                if docker compose pull --quiet --ignore-buildable; then
                  break
                elif [ "$attempt" -eq 3 ]; then
                  echo "::error::docker compose pull failed after 3 attempts; aborting"
                  exit 1
                fi
                echo "::warning::docker compose pull failed (attempt ${attempt}/3); retrying in 15s"
                sleep 15
              done

      - name: Load and Start Appwrite
        timeout-minutes: ${{ matrix.config.wait == 'clamav' && 15 || 5 }}
        env:
          _APP_OPTIONS_ABUSE: ${{ matrix.config.options_abuse }}
          _APP_STORAGE_ANTIVIRUS: ${{ matrix.config.storage_antivirus }}
          # The s3 config points every storage device and the executor at the MinIO profile service.
          _APP_STORAGE_DEVICE: ${{ matrix.config.storage_device || 'local' }}
          _APP_STORAGE_S3_ACCESS_KEY: minio
          _APP_STORAGE_S3_SECRET: minio12345
          _APP_STORAGE_S3_BUCKET: appwrite
          _APP_STORAGE_S3_REGION: us-east-1
          _APP_STORAGE_S3_ENDPOINT: http://minio:9000
          _APP_EXECUTOR_CONNECTION_STORAGE: ${{ matrix.config.storage_device == 's3' && 's3://minio:minio12345@localhost?region=us-east-1&url=http%3A%2F%2Fminio%3A9000' || 'local://localhost' }}
          _APP_DATABASE_SHARED_TABLES: ${{ matrix.mode != 'dedicated' && 'database_db_main' || '' }}
          _APP_DATABASE_DOCUMENTSDB_SHARED_TABLES: ${{ matrix.mode != 'dedicated' && 'documentsdb_db_main' || '' }}
          _APP_DATABASE_VECTORSDB_SHARED_TABLES: ${{ matrix.mode != 'dedicated' && 'vectorsdb_db_main' || '' }}
          _APP_DOCUMENTSDB: enabled
          _APP_VECTORSDB: enabled
        run: |
          if [ "${{ matrix.config.wait }}" = "clamav" ]; then
            docker compose up -d --quiet-pull --wait --wait-timeout 780
          else
            docker compose up -d --quiet-pull --wait
          fi

      - name: Wait for Open Runtimes
        if: matrix.config.wait == 'executor'
        timeout-minutes: 3
        run: |
          while ! docker logs exc1 | grep -q "Executor is ready."; do
            echo "Waiting for Executor to come online"
            sleep 1
          done

      - name: Wait for ClamAV
        if: matrix.config.wait == 'clamav'
        timeout-minutes: 10
        run: |
          for attempt in $(seq 1 120); do
            if docker compose exec -T appwrite php -r '
              require "/usr/src/code/vendor/autoload.php";
              $host = getenv("_APP_STORAGE_ANTIVIRUS_HOST") ?: "clamav";
              $port = (int) (getenv("_APP_STORAGE_ANTIVIRUS_PORT") ?: 3310);
              $av = new Appwrite\ClamAV\Network($host, $port);
              exit(@$av->ping() ? 0 : 1);
            '; then
              echo "ClamAV is ready"
              exit 0
            fi
            echo "Waiting for ClamAV (attempt ${attempt}/120)"
            sleep 5
          done
          echo "::error::ClamAV did not become ready"
          docker compose logs --timestamps clamav || true
          exit 1

      - name: Run tests
        timeout-minutes: 15
        run: |
          selection=(--exclude-testsuite unit --group "${{ matrix.config.group }}")
          if [ "${{ matrix.config.suite }}" != all ]; then
            selection+=(--testsuite "${{ matrix.config.suite }}")
          fi
          docker compose exec -T appwrite vendor/bin/phpunit "${selection[@]}" --list-tests-xml /tmp/expected.xml
          docker compose exec -T -e _APP_E2E_RESPONSE_FORMAT="${{ github.event.inputs.response_format }}" \
            appwrite test "${selection[@]}" --log-junit /tmp/junit.xml --fail-on-skipped --fail-on-incomplete
          docker compose exec -T appwrite php tests/tools/results.php /tmp/expected.xml /tmp/junit.xml --fail-on-skipped

      - name: Collect test reports
        if: always()
        run: |
          mkdir -p test-results
          docker compose cp appwrite:/tmp/expected.xml test-results/expected.xml || true
          docker compose cp appwrite:/tmp/junit.xml test-results/junit.xml || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ matrix.config.group }}-${{ matrix.mode }}
          path: test-results

      - name: Failure Logs
        if: failure()
        run: |
          echo "=== Appwrite Logs ==="
          docker compose logs --timestamps
          if [ "${{ matrix.config.wait }}" = "clamav" ]; then
            echo "=== ClamAV Logs ==="
            docker compose logs --timestamps clamav || true
          fi
          if [ "${{ matrix.config.storage_device }}" = "s3" ]; then
            echo "=== MinIO Logs ==="
            docker compose logs --timestamps minio || true
          fi

  benchmark:
    name: Benchmark
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: runs-on=${{ github.run_id }}/runner=4cpu-linux-x64/volume=60g/spot=price-capacity-optimized/retry=when-interrupted/extras=otel+ecr-cache
    timeout-minutes: 20
    needs: build
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
      packages: read
    env:
      # The before stack is a worktree at an arbitrary older SHA, so its compose file
      # may not gate databases at all. Start the superset on both sides, otherwise the
      # two runs measure different amounts of idle container load rather than the diff.
      COMPOSE_PROFILES: mariadb,mongodb
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Login to Docker Hub
        if: ${{ env.DOCKERHUB_AUTH_AVAILABLE == 'true' }}
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - parallel:
          - name: Pull Appwrite image
            run: |
              docker pull ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }}
              docker tag ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }} ${{ env.IMAGE }}
              docker tag ${{ env.RUNS_ON_ECR_CACHE }}:${{ env.IMAGE }}-${{ github.sha }} ${{ env.IMAGE }}:after

          - name: Setup k6
            uses: grafana/setup-k6-action@db07bd9765aac508ef18982e52ab937fe633a065 # v1.2.1
            with:
              k6-version: ${{ env.K6_VERSION }}

      - name: Prepare benchmark before
        id: benchmark_before_prepare
        continue-on-error: true
        env:
          BENCHMARK_BEFORE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          git fetch --depth=1 origin "${BENCHMARK_BEFORE_SHA}"
          git worktree add --detach /tmp/appwrite-benchmark-before "${BENCHMARK_BEFORE_SHA}"
          docker build \
            --cache-from ${{ env.IMAGE }}:after \
            --target development \
            --build-arg DEBUG=false \
            --build-arg TESTING=true \
            --build-arg VERSION=dev \
            --tag ${{ env.IMAGE }}:before \
            /tmp/appwrite-benchmark-before

      - name: Start before Appwrite
        id: benchmark_before_start
        if: steps.benchmark_before_prepare.outcome == 'success'
        continue-on-error: true
        working-directory: /tmp/appwrite-benchmark-before
        env:
          _APP_DOMAIN: localhost
          _APP_CONSOLE_DOMAIN: localhost
          _APP_DOMAIN_FUNCTIONS: functions.localhost
          _APP_OPTIONS_ABUSE: disabled
        run: |
          docker tag ${{ env.IMAGE }}:before ${{ env.IMAGE }}
          docker compose up -d --wait --no-build
          for attempt in $(seq 1 10); do
            if curl -fsS http://localhost:9520/v1/health/version; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              exit 1
            fi
            sleep 1
          done

      - name: Prepare benchmark files
        run: rm -f benchmark-before-summary.json benchmark-after-summary.json benchmark-before-samples.json benchmark-after-samples.json

      - name: Benchmark before
        if: steps.benchmark_before_start.outcome == 'success'
        continue-on-error: true
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        env:
          APPWRITE_ENDPOINT: 'http://localhost:9520/v1'
          APPWRITE_BENCHMARK_DURATION: '1m'
          APPWRITE_BENCHMARK_VUS: '20'
          APPWRITE_WORKER_TIMEOUT_MS: '120000'
          APPWRITE_BENCHMARK_SUMMARY_PATH: 'benchmark-before-summary.json'
        with:
          path: tests/benchmarks/http.js
          flags: --quiet --out json=benchmark-before-samples.json
          cloud-comment-on-pr: false
          debug: true

      - name: Stop before Appwrite
        if: always()
        run: |
          if [ -d /tmp/appwrite-benchmark-before ]; then
            cd /tmp/appwrite-benchmark-before
            docker compose down -v || true
          fi

      - name: Wait for benchmark ports
        if: always()
        run: |
          for port in 9520 9521 9522 9503; do
            for attempt in $(seq 1 30); do
              if ! ss -ltn | awk '{print $4}' | grep -Eq "[:.]${port}$"; then
                break
              fi
              sleep 1
            done

            if ss -ltn | awk '{print $4}' | grep -Eq "[:.]${port}$"; then
              echo "Port ${port} is still in use after stopping the before stack"
              ss -ltn
              exit 1
            fi
          done

      - name: Start after Appwrite
        env:
          _APP_DOMAIN: localhost
          _APP_CONSOLE_DOMAIN: localhost
          _APP_DOMAIN_FUNCTIONS: functions.localhost
          _APP_OPTIONS_ABUSE: disabled
        run: |
          docker tag ${{ env.IMAGE }}:after ${{ env.IMAGE }}
          docker compose up -d --wait --no-build
          for attempt in $(seq 1 10); do
            if curl -fsS http://localhost:9520/v1/health/version; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              exit 1
            fi
            sleep 1
          done

      - name: Benchmark after
        id: benchmark_after
        continue-on-error: true
        uses: grafana/run-k6-action@de51a7390bdf0ac85a3bef493691bd71d4c7c158 # v1.4.0
        env:
          APPWRITE_ENDPOINT: 'http://localhost:9520/v1'
          APPWRITE_BENCHMARK_DURATION: '1m'
          APPWRITE_BENCHMARK_VUS: '20'
          APPWRITE_WORKER_TIMEOUT_MS: '120000'
          APPWRITE_BENCHMARK_PREVIOUS_SUMMARY_PATH: '../../benchmark-before-summary.json'
          APPWRITE_BENCHMARK_SUMMARY_PATH: 'benchmark-after-summary.json'
        with:
          path: tests/benchmarks/http.js
          flags: --quiet --out json=benchmark-after-samples.json
          cloud-comment-on-pr: false
          debug: true

      - name: Stop after Appwrite
        if: always()
        run: docker compose down -v || true

      - name: Comment on PR
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BENCHMARK_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.event.before }}
          BENCHMARK_HEAD_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.sha }}
        with:
          script: |
            const comment = require('./.github/workflows/benchmark-comment.js');
            await comment({ github, context, core });

      - name: Save results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: benchmark-results
          path: |
            benchmark-comment.txt
            benchmark-before-summary.json
            benchmark-after-summary.json
            benchmark-before-samples.json
            benchmark-after-samples.json
          retention-days: 7

      - name: Fail benchmark
        if: always() && steps.benchmark_after.outcome != 'success'
        run: exit 1

  tests_complete:
    name: Tests / Complete
    if: always()
    runs-on: ubuntu-latest
    needs: [matrix, unit, e2e_general, e2e_service, e2e_grouped]
    steps:
      - name: Require every selected test job to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os

          results = json.loads(os.environ['RESULTS'])
          allowed_skips = set()
          failures = [name for name, job in results.items()
                      if job['result'] != 'success'
                      and not (name in allowed_skips and job['result'] == 'skipped')]
          if failures:
              raise SystemExit('Tests not verified: ' + ', '.join(failures))
          PYTHON
