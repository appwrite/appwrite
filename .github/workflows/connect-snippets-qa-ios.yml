name: Connect snippets QA (iOS)

# PLACEHOLDER - the real suite is not wired up yet.
#
# This exists so the workflow is registered on the default branch and can be
# dispatched from the Actions UI. The steps below only echo; no app is built
# and nothing is asserted, so a green run here means "the workflow is
# reachable", not "the iOS snippets work".
#
# The real implementation runs on macos-15 and builds an unsigned simulator
# .app per framework (XcodeGen for native SwiftUI, since Apple ships no
# project-scaffolding CLI), installs it with simctl and drives the shared
# Maestro auth flow against it. Kept on ubuntu-latest while it is a stub so
# the placeholder does not burn macOS minutes, which bill at ~10x.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: react-native
          - id: flutter
          - id: apple

    steps:
      - uses: actions/checkout@v4

      - name: Placeholder
        run: |
          echo "Connect snippets QA (iOS) - ${{ matrix.id }}"
          echo "Placeholder run: no app is built and nothing is asserted yet."
