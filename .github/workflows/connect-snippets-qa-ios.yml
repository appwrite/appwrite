name: Connect snippets QA (iOS)

# macOS runners bill at ~10x Linux and this repo is private, so this stays
# manual - same trigger as the web/server/Android suites.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CODE_SNIPPET_QA_ENDPOINT: ${{ vars.CODE_SNIPPET_QA_ENDPOINT }}
  CODE_SNIPPET_QA_PROJECT_ID: ${{ vars.CODE_SNIPPET_QA_PROJECT_ID }}
  # Every mobile QA app is built under this bundle id so the one shared flow
  # (../mobile/.maestro/auth.yaml) drives Android and iOS alike.
  APP_ID: io.appwrite.connectqa

defaults:
  run:
    working-directory: tests/connect-qa/ios

jobs:
  qa:
    name: ${{ matrix.id }}
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # `create` scaffolds a starter, `configure` adapts it to the QA
          # harness (bundle id + anything the snippet needs), `install` adds
          # the Appwrite SDK, `build` must leave a simulator .app somewhere
          # under `app_search`.
          #
          # Unlike Android there is no signing setup anywhere here: an
          # iphonesimulator build is never signed, so no certificates or
          # provisioning profiles are involved.

          # Native SwiftUI. Apple ships no project-scaffolding CLI, so the
          # harness template carries an XcodeGen spec + the @main entry point
          # a real Xcode project would already have.
          - id: apple
            sdk: apple
            snippets: apple
            template: apple
            config_file: Appwrite.xcconfig
            copy_to: Sources
            create: mkdir -p "$APP_DIR"
            configure: xcodegen generate
            install: 'true' # SPM resolves during the build
            build: xcodebuild -project ConnectQA.xcodeproj -scheme ConnectQA -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO
            app_search: build/Build/Products/Release-iphonesimulator

          - id: react-native
            sdk: react-native
            snippets: react-native
            template: ''
            config_file: .env
            create: npx -y create-expo-app@latest "$APP_DIR" --template blank-typescript --no-install
            configure: jq --arg id "$APP_ID" '.expo.ios.bundleIdentifier = $id' app.json > app.json.tmp && mv app.json.tmp app.json
            install: npm install && npm install react-native-appwrite
            # prebuild after the SDK install so autolinking sees its native
            # deps; --no-install then an explicit pod install, so a CocoaPods
            # failure is its own step in the log rather than buried in prebuild.
            build: npx expo prebuild --platform ios --no-install && pod install --project-directory=ios && xcodebuild -workspace ios/*.xcworkspace -scheme "$(xcodebuild -workspace ios/*.xcworkspace -list -json | jq -r '.workspace.schemes[0]')" -configuration Release -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO
            app_search: build/Build/Products/Release-iphonesimulator

          - id: flutter
            sdk: flutter
            snippets: flutter
            template: ''
            config_file: env.json
            copy_to: .
            # --org + --project-name yields the io.appwrite.connectqa bundle id.
            create: flutter create --org io.appwrite --project-name connectqa "$APP_DIR"
            configure: 'true'
            install: flutter pub add appwrite
            # --simulator implies a debug (JIT) build, which needs no signing.
            build: flutter build ios --simulator --debug --dart-define-from-file=env.json
            app_search: build/ios/iphonesimulator

    steps:
      - uses: actions/checkout@v4

      - name: Check Appwrite variables
        run: |
          if [ -z "$CODE_SNIPPET_QA_ENDPOINT" ] || [ -z "$CODE_SNIPPET_QA_PROJECT_ID" ]; then
            echo "::error::Set the CODE_SNIPPET_QA_ENDPOINT and CODE_SNIPPET_QA_PROJECT_ID repository variables."
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Install tooling via mise (node, maestro, java)
        run: |
          mise trust
          mise install

      - name: Install XcodeGen
        if: matrix.id == 'apple'
        run: brew install xcodegen

      - name: Install Flutter
        if: matrix.id == 'flutter'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show the toolchain in use
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Scaffold starter app
        run: |
          APP_DIR="app-$(date +%s)-$RANDOM"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          # Subshell: a scaffold that ends with `cd "$APP_DIR"` would otherwise
          # make the check below look for $APP_DIR inside itself.
          ( ${{ matrix.create }} )
          if [ ! -d "$APP_DIR" ]; then
            echo "::error::Scaffold did not produce $APP_DIR"
            exit 1
          fi

      - name: Apply QA harness overlay
        run: |
          # Harness-only files that are never part of the snippet. Guarded on
          # a non-empty matrix.template: an unset value would expand to
          # "templates/", copying every framework's overlay at once.
          TEMPLATE="${{ matrix.template }}"
          if [ -n "$TEMPLATE" ] && [ -d "templates/$TEMPLATE" ]; then
            cp -Rv "templates/$TEMPLATE/." "$APP_DIR/"
          fi

      - name: Paste Connect snippets over the starter
        run: |
          SRC="$GITHUB_WORKSPACE/src/components/pages/projects/\$projectId/shared/connect-snippets/${{ matrix.snippets }}"
          DEST="$APP_DIR/${{ matrix.copy_to || '.' }}"
          mkdir -p "$DEST"
          cp -Rv "$SRC/." "$DEST/"

      - name: Install dependencies + Appwrite SDK
        run: |
          cd "$APP_DIR"
          ${{ matrix.install }}

      # Writes exactly the file the Connect dialog tells users to write, with
      # exactly the variable names it documents - so drift between the docs
      # and what the snippet reads shows up as a failed assertion below.
      - name: Write config file (derived from connect-snippets.ts)
        run: |
          node ../write-env.mjs "${{ matrix.sdk }}" "${{ matrix.sdk }}" "${{ matrix.sdk }}" "$APP_DIR"
          cat "$APP_DIR/${{ matrix.config_file }}"

      - name: Configure the app for the QA harness
        run: |
          cd "$APP_DIR"
          ${{ matrix.configure }}

      - name: Build the simulator app
        run: |
          cd "$APP_DIR"
          ${{ matrix.build }}
          APP_PATH="$(find "${{ matrix.app_search }}" -maxdepth 2 -name '*.app' -type d | head -1)"
          if [ -z "$APP_PATH" ]; then
            echo "::error::Build did not produce a .app under ${{ matrix.app_search }}"
            exit 1
          fi
          echo "APP_PATH=$PWD/$APP_PATH" >> "$GITHUB_ENV"
          echo "Built $APP_PATH"

      # Guards the whole config chain. Each platform injects the endpoint
      # differently (Info.plist here, the JS bundle for React Native, the Dart
      # snapshot for Flutter), but in every case the value has to end up
      # somewhere inside the bundle - and if it does not, the app still renders
      # "Sign in to get started." because the snippet swallows the failed
      # account.get(), so the Maestro flow alone would pass regardless.
      - name: Assert the endpoint is embedded in the app bundle
        run: |
          if ! grep -raqF "$CODE_SNIPPET_QA_ENDPOINT" "$APP_PATH"; then
            echo "::error::$CODE_SNIPPET_QA_ENDPOINT is not present in $APP_PATH - the config never reached the build."
            exit 1
          fi
          echo "Endpoint found in the app bundle."

      - name: Boot a single iOS Simulator
        run: |
          # Exactly one booted device, so Maestro has no ambiguity about which
          # to drive and needs no --device flag.
          xcrun simctl shutdown all || true
          UDID="$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))] | last | .udid')"
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "::error::No available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl list devices booted

      - name: Install the app and run the Maestro auth flow
        run: |
          mkdir -p artifacts/maestro
          xcrun simctl install "$SIM_UDID" "$APP_PATH"

          run_flow() {
            mise run test \
              --debug-output="$PWD/artifacts/maestro" \
              --flatten-debug-output \
              --format=junit \
              --output="$PWD/artifacts/maestro/report.xml"
          }

          # A cold simulator can drop Maestro's first XCUITest connection; one
          # retry absorbs that without hiding a real failure.
          status=0
          run_flow || {
            echo "::warning::Maestro flow failed - retrying once"
            xcrun simctl terminate "$SIM_UDID" "$APP_ID" || true
            run_flow || status=1
          }

          # Captured on failure too - this is where a native crash shows up.
          xcrun simctl spawn "$SIM_UDID" log collect --output artifacts/sim-logs.logarchive 2>/dev/null || true
          exit $status

      - name: Collect logs and app source
        if: always()
        run: |
          mkdir -p artifacts
          # Safety net: if a future maestro version ignores --debug-output,
          # grab whatever landed in the default location instead.
          if [ -d "$HOME/.maestro/tests" ]; then
            cp -R "$HOME/.maestro/tests/." artifacts/maestro-default-output/ || true
          fi
          # The exact app that was tested (snippets pasted, config written),
          # ready for a local rebuild - dependency trees and build output out.
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            zip -qr artifacts/app-source.zip "$APP_DIR" \
              -x "*/node_modules/*" "*/.git/*" "*/build/*" "*/Pods/*" \
              "*/.expo/*" "*/DerivedData/*" "*.xcodeproj/*" || true
          fi

      - name: Upload Maestro logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-qa-ios-${{ matrix.id }}
          path: tests/connect-qa/ios/artifacts/
          if-no-files-found: warn
