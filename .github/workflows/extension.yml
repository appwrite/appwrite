name: Extension image

# Publishes the utopia extension on its own as appwrite/utopia-extension, so PHP
# services outside the Appwrite image (Edge, DNS) load the same build the
# packages in packages/ are stubbed against:
#
#   COPY --from=appwrite/utopia-extension:<version> /utopia.so /usr/local/lib/php/utopia.so
#
# A release publishes <version> and latest; main publishes main. Every run that
# is not a release also publishes build-<hash>, the tag crates/extension/tag.sh
# prints for the tree: a hash of the build's inputs, for a consumer that tracks
# main by commit (appwrite-labs/cloud) and finds its image by running the same
# script. It is written once and never replaced, so a manual run on another
# branch can add the image a branch's crates need but cannot change a
# published tag. Each
# architecture builds on its own native runner (no QEMU) and is smoke-tested on
# stock php:8.5-cli-alpine with only the documented runtime packages before it
# is pushed. That image floats on purpose, while the build's base is pinned: it
# is what a consumer pulls, so a run that fails there on an unrelated commit
# means the stock image moved (a new Alpine, another libheif) and the extension
# no longer loads on it. See crates/extension/README.md.

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'Dockerfile'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: appwrite/utopia-extension
  # Runtime packages a consumer installs next to the .so; the smoke test uses
  # exactly these, so the README cannot drift from what loads.
  RUNTIME_PACKAGES: libheif libstdc++

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    # Both architectures resolve the same values.
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # A release stamps its version into phpversion('utopia'), as release.yml
      # does for the Appwrite image; other runs keep the crate version. `tag` is
      # the moving tag the run publishes (none off main) and `build` the tree's
      # build-<hash>, empty on a release, whose library is stamped, and when
      # Docker Hub already has it. A published version is immutable, as
      # appwrite/appwrite's are: consumers pin the tag, so a rerun must not
      # replace what they pulled. The check is on the manifest tag, which is
      # written last, so a run that failed halfway can still be rerun.
      - name: Resolve version
        id: version
        env:
          RELEASE: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            version="${RELEASE#v}"
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --retry 3 --retry-all-errors --max-time 30 \
              "https://hub.docker.com/v2/repositories/$IMAGE/tags/$version" || true)
            if [ "$status" != "404" ]; then
              echo "::error::Docker Hub answered $status for $IMAGE:$version. Published versions are immutable; ship a new patch version instead."
              exit 1
            fi
            echo "stamp=$version" >> "$GITHUB_OUTPUT"
            echo "tag=$version" >> "$GITHUB_OUTPUT"
            echo "build=" >> "$GITHUB_OUTPUT"
          else
            build=$(crates/extension/tag.sh)
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --retry 3 --retry-all-errors --max-time 30 \
              "https://hub.docker.com/v2/repositories/$IMAGE/tags/$build" || true)
            if [ "$status" = "200" ]; then
              echo "$IMAGE:$build is already published."
              build=""
            fi
            tag=""
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              tag=main
            fi
            echo "stamp=" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "build=$build" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build
        env:
          STAMP: ${{ steps.version.outputs.stamp }}
        run: |
          docker buildx build --target extension \
            --build-arg UTOPIA_EXTENSION_VERSION="$STAMP" \
            --output type=local,dest=out .
          ls -la out/utopia.so

      - name: Smoke test on stock PHP
        env:
          STAMP: ${{ steps.version.outputs.stamp }}
        run: |
          docker run --rm -v "$PWD/out/utopia.so:/usr/local/lib/php/utopia.so:ro" \
            -e STAMP="$STAMP" php:8.5-cli-alpine sh -euc "
              apk add --no-cache $RUNTIME_PACKAGES > /dev/null
              php -d extension=/usr/local/lib/php/utopia.so -r '
                extension_loaded(\"utopia\") || exit(\"utopia did not load\n\");
                \$stamp = getenv(\"STAMP\");
                if (\$stamp !== \"\" && phpversion(\"utopia\") !== \$stamp) {
                    exit(\"phpversion(utopia) is \" . phpversion(\"utopia\") . \", expected \$stamp\n\");
                }
                \$checks = [
                    \"domain\" => (new Utopia\Domains\Domain(\"www.example.co.uk\"))->getRegisterable() === \"example.co.uk\",
                    \"email\" => (new Utopia\Emails\Email(\"someone@example.com\"))->getDomain() === \"example.com\",
                    \"hash\" => (new ReflectionClass(Utopia\Auth\Hashes\Argon2::class))->isInternal(),
                    \"validator\" => (new ReflectionClass(Utopia\Validator\Text::class))->isInternal(),
                ];
                foreach (\$checks as \$name => \$ok) {
                    \$ok || exit(\"\$name check failed\n\");
                }
                echo \"utopia \", phpversion(\"utopia\"), \" loads on \", PHP_VERSION, \" (\", php_uname(\"m\"), \")\n\";
              '
            "

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        if: steps.version.outputs.tag != '' || steps.version.outputs.build != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push
        if: steps.version.outputs.tag != '' || steps.version.outputs.build != ''
        env:
          STAMP: ${{ steps.version.outputs.stamp }}
          TAG: ${{ steps.version.outputs.tag }}
          BUILD: ${{ steps.version.outputs.build }}
          ARCH: ${{ matrix.arch }}
        run: |
          tags=""
          for tag in $TAG $BUILD; do
            tags="$tags --tag $IMAGE:$tag-$ARCH"
          done
          # shellcheck disable=SC2086 # $tags is a list of arguments
          docker buildx build --target extension \
            --build-arg UTOPIA_EXTENSION_VERSION="$STAMP" \
            --platform "linux/$ARCH" $tags --push .

  manifest:
    name: Manifest
    needs: build
    if: needs.build.outputs.tag != '' || needs.build.outputs.build != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish
        env:
          TAG: ${{ needs.build.outputs.tag }}
          BUILD: ${{ needs.build.outputs.build }}
        run: |
          extra=""
          if [ "$GITHUB_EVENT_NAME" = "release" ]; then
            extra="--tag $IMAGE:latest"
          fi
          for tag in $TAG $BUILD; do
            # shellcheck disable=SC2086 # $extra is an optional argument
            docker buildx imagetools create --tag "$IMAGE:$tag" $extra \
              "$IMAGE:$tag-amd64" "$IMAGE:$tag-arm64"
            docker buildx imagetools inspect "$IMAGE:$tag"
          done
