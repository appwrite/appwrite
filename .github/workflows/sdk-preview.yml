name: "SDK Preview"

env:
  COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml

on:
  pull_request:
    paths:
      - "apps/console/**"
      - ".github/workflows/sdk-preview.yml"
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: "Platform to build"
        options:
          - client
          - server
          - console

permissions:
  contents: read

jobs:
  setup:
    name: Setup & Build SDK
    if: github.event_name == 'workflow_dispatch' && inputs.platform != 'console'
    runs-on: gcrunner=${{ github.run_id }}-setup-${{ strategy.job-index }}/runner=publish
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set SDK type
        id: set-sdk
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
        run: |
          if [ -z "$PLATFORM" ]; then
            PLATFORM="console"
          fi
          if [ "$PLATFORM" = "server" ]; then
            echo "sdk_type=nodejs" >> "$GITHUB_OUTPUT"
          else
            echo "sdk_type=web" >> "$GITHUB_OUTPUT"
          fi
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
        
      - parallel:
          - name: Load and Start Appwrite
            run: |
              docker compose build
              docker compose up -d

          - name: Setup Node
            uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
            with:
              node-version: 20

      - name: Generate Specs
        run: |
          docker compose exec -e _APP_SDK_PREVIEW=enabled appwrite specs --version=latest --mode=normal --git=no

      - name: Generate SDK
        env:
          PLATFORM: ${{ steps.set-sdk.outputs.platform }}
          SDK: ${{ steps.set-sdk.outputs.sdk_type }}
        run: |
          docker compose exec -e _APP_SDK_PREVIEW=enabled appwrite sdks --platform="$PLATFORM" --sdk="$SDK" --version=latest --git=no
          sudo chown -R "$USER:$USER" "./app/sdks/$PLATFORM-$SDK"

      - name: Build and Publish SDK
        working-directory: ./app/sdks/${{ steps.set-sdk.outputs.platform }}-${{ steps.set-sdk.outputs.sdk_type }}
        run: |
            npm install
            npm run build
            npx pkg-pr-new publish --comment=update --no-compact

  changes:
    name: Console / Changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      preview: ${{ steps.changes.outputs.preview }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 2

      # A Console change that ships with API changes needs a Console SDK no release carries yet.
      - name: Compute changes
        id: changes
        run: |
          FILES=$(git diff --name-only HEAD^1 HEAD)
          CONSOLE=$(echo "$FILES" | grep -c '^apps/console/' || true)
          API=$(echo "$FILES" | grep -c -E '^(app|src|packages)/|^composer\.lock$|^apps/console/scripts/sdk-preview\.ts$|^\.github/workflows/sdk-preview\.yml$' || true)
          if [ "$CONSOLE" -gt 0 ] && [ "$API" -gt 0 ]; then
            echo "preview=true" >> "$GITHUB_OUTPUT"
          else
            echo "preview=false" >> "$GITHUB_OUTPUT"
          fi

  console:
    name: Console / Preview SDK
    needs: changes
    if: >-
      always()
      && (needs.changes.outputs.preview == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.platform == 'console'))
    # gcrunner refuses jobs from forks; those build the image without the layer cache.
    runs-on: >-
      ${{ (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
      && format('gcrunner={0}-console/runner=build', github.run_id)
      || 'ubuntu-24.04' }}
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # The runner injects GCRUNNER_REGISTRY into the shell only; action inputs
      # read ${{ env.* }}, which needs it promoted to GITHUB_ENV first.
      - name: Expose the runner registry to workflow expressions
        if: runner.environment == 'self-hosted'
        run: echo "GCRUNNER_REGISTRY=${GCRUNNER_REGISTRY}" >> "${GITHUB_ENV}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The image the preview script runs the CLI in: Appwrite's CLI boots only with the
      # utopia extension, which a host PHP does not load. Reads CI's layer cache, never writes it.
      - name: Build Appwrite
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: appwrite-dev
          target: development
          cache-from: ${{ env.GCRUNNER_REGISTRY && format('type=registry,ref={0}/appwrite:buildcache', env.GCRUNNER_REGISTRY) || '' }}
          build-args: |
            DEBUG=false
            TESTING=true
            VERSION=dev

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          # The job publishes the SDK it builds: no cache another run could have written.
          package-manager-cache: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4
          no-cache: true

      - name: Install dependencies
        working-directory: apps/console
        run: bun install --frozen-lockfile

      - name: Build SDK
        working-directory: apps/console
        run: bun run sdk:preview --no-install

      - name: Publish SDK
        working-directory: app/sdks/console-web
        run: npx pkg-pr-new@0.0.88 publish --comment=update --no-compact
