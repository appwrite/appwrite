name: Connect snippets QA (server)

on:
  workflow_dispatch:

permissions:
  contents: read

# Server snippets read Appwrite config straight from the process environment
# (APPWRITE_ENDPOINT / APPWRITE_PROJECT_ID / APPWRITE_API_KEY), so unlike the
# web workflow there is no framework env file to derive - exporting the vars
# job-wide is the whole env setup. The API key is a repository secret, not a
# variable.
env:
  CODE_SNIPPET_QA_ENDPOINT: ${{ vars.CODE_SNIPPET_QA_ENDPOINT }}
  CODE_SNIPPET_QA_PROJECT_ID: ${{ vars.CODE_SNIPPET_QA_PROJECT_ID }}
  CODE_SNIPPET_QA_API_KEY: ${{ secrets.CODE_SNIPPET_QA_API_KEY }}
  APPWRITE_ENDPOINT: ${{ vars.CODE_SNIPPET_QA_ENDPOINT }}
  APPWRITE_PROJECT_ID: ${{ vars.CODE_SNIPPET_QA_PROJECT_ID }}
  APPWRITE_API_KEY: ${{ secrets.CODE_SNIPPET_QA_API_KEY }}

defaults:
  run:
    working-directory: tests/connect-qa/server

jobs:
  qa:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Two sample shapes, two assertion tools:
        #   kind: http - the sample serves PATCH/GET /v1/policies; Hurl
        #     (policies.hurl) asserts status, content type and JSON body
        #     against the running server.
        #   kind: cli - the sample runs to completion; commander
        #     (commander.yaml) asserts its exit code and printed output.
        # Runtimes not preinstalled on ubuntu-latest come from mise (tools:)
        # or a setup action (swift, dart); python, php, ruby, go, rust and
        # dotnet use the runner's.
        include:
          - id: node-vanilla
            kind: cli
            snippets: node/vanilla
            tools: node@24
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && npm init -y && npm pkg set type=module
            install: npm install node-appwrite tsx
            run: npx tsx src/index.ts

          - id: node-hono
            kind: http
            snippets: node/hono
            tools: node@24
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && npm init -y && npm pkg set type=module
            install: npm install hono @hono/node-server node-appwrite tsx
            port: 3000
            start: npx tsx src/index.ts

          - id: node-fastify
            kind: http
            snippets: node/fastify
            tools: node@24
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && npm init -y && npm pkg set type=module
            install: npm install fastify node-appwrite tsx
            port: 3000
            start: npx tsx src/index.ts

          # `nest new` scaffolds and installs its own dependencies; the sample
          # only adds the Appwrite SDK on top.
          - id: node-nestjs
            kind: http
            snippets: node/nestjs
            tools: node@24
            create: npx -y @nestjs/cli new "$APP_DIR" --package-manager npm --skip-git
            install: npm install node-appwrite
            port: 3000
            start: npm run start

          - id: node-express
            kind: http
            snippets: node/express
            tools: node@24
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && npm init -y && npm pkg set type=module
            install: npm install express node-appwrite tsx
            port: 3000
            start: npx tsx src/index.ts

          - id: node-koa
            kind: http
            snippets: node/koa
            tools: node@24
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && npm init -y && npm pkg set type=module
            install: npm install koa @koa/router node-appwrite tsx
            port: 3000
            start: npx tsx src/index.ts

          - id: bun-vanilla
            kind: cli
            snippets: bun/vanilla
            tools: bun@latest
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && bun init -y
            install: bun add node-appwrite
            run: bun run src/index.ts

          - id: bun-elysia
            kind: http
            snippets: bun/elysia
            tools: bun@latest
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && bun init -y
            install: bun add elysia node-appwrite
            port: 3000
            start: bun run src/index.ts

          # Hono's sample has no explicit .listen - Bun serves the default
          # export on :3000.
          - id: bun-hono
            kind: http
            snippets: bun/hono
            tools: bun@latest
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && bun init -y
            install: bun add hono node-appwrite
            port: 3000
            start: bun run src/index.ts

          - id: deno-vanilla
            kind: cli
            snippets: deno/vanilla
            tools: deno@2
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && deno init
            install: deno cache main.ts
            run: deno run -A main.ts

          - id: deno-hono
            kind: http
            snippets: deno/hono
            tools: deno@2
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && deno init
            install: deno cache main.ts
            port: 8000
            start: deno run -A main.ts

          # Fresh's init prompts for Tailwind and VS Code config; answer both
          # with no via stdin.
          - id: deno-fresh
            kind: http
            snippets: deno/fresh
            tools: deno@2
            create: printf 'n\nn\n' | deno run -A -r https://fresh.deno.dev "$APP_DIR"
            port: 8000
            start: deno task start

          - id: python
            kind: cli
            snippets: python/vanilla
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && python3 -m venv .venv
            install: .venv/bin/pip install --quiet appwrite
            run: .venv/bin/python main.py

          - id: python-fastapi
            kind: http
            snippets: python/fastapi
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && python3 -m venv .venv
            install: .venv/bin/pip install --quiet appwrite fastapi uvicorn
            port: 8000
            start: .venv/bin/uvicorn main:app --port 8000

          # django-admin only exists once Django is installed, so the scaffold
          # step creates the venv and installs it before calling startproject.
          - id: python-django
            kind: http
            snippets: python/django
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && python3 -m venv .venv && .venv/bin/pip install --quiet django && .venv/bin/django-admin startproject config .
            install: .venv/bin/pip install --quiet appwrite
            port: 8000
            start: .venv/bin/python manage.py runserver 8000

          - id: python-flask
            kind: http
            snippets: python/flask
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && python3 -m venv .venv
            install: .venv/bin/pip install --quiet appwrite flask
            port: 5000
            start: .venv/bin/python app.py

          - id: php
            kind: cli
            snippets: php/vanilla
            create: mkdir -p "$APP_DIR"
            install: composer require --no-interaction appwrite/appwrite
            run: php index.php

          - id: php-laravel
            kind: http
            snippets: php/laravel
            create: composer create-project --no-interaction laravel/laravel "$APP_DIR"
            install: composer require --no-interaction appwrite/appwrite
            port: 8000
            start: php artisan serve --port=8000

          # No symfony CLI on the runner; PHP's built-in server with the front
          # controller as the router script serves the app just as well.
          - id: php-symfony
            kind: http
            snippets: php/symfony
            create: composer create-project --no-interaction symfony/skeleton "$APP_DIR"
            install: composer require --no-interaction appwrite/appwrite
            port: 8000
            start: php -S 127.0.0.1:8000 -t public public/index.php

          - id: ruby
            kind: cli
            snippets: ruby/vanilla
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && bundle init
            install: bundle add appwrite
            run: bundle exec ruby main.rb

          - id: ruby-rails
            kind: http
            snippets: ruby/rails
            create: gem install rails --no-document && rails new "$APP_DIR" --api --skip-git --skip-test --skip-bundle
            install: bundle add appwrite
            port: 3000
            start: bin/rails server -p 3000

          - id: dotnet
            kind: cli
            snippets: dotnet/vanilla
            create: dotnet new console -o "$APP_DIR"
            install: dotnet add package Appwrite
            run: dotnet run

          - id: dotnet-minimal
            kind: http
            snippets: dotnet/minimal
            create: dotnet new web -o "$APP_DIR"
            install: dotnet add package Appwrite
            port: 5000
            start: dotnet run

          - id: dotnet-controllers
            kind: http
            snippets: dotnet/controllers
            create: dotnet new web -o "$APP_DIR"
            install: dotnet add package Appwrite
            port: 5000
            start: dotnet run

          - id: go
            kind: cli
            snippets: go/vanilla
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && go mod init connect-qa
            install: go mod tidy
            run: go run .

          - id: go-gin
            kind: http
            snippets: go/gin
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && go mod init connect-qa
            install: go mod tidy
            port: 3000
            start: go run .

          - id: go-echo
            kind: http
            snippets: go/echo
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && go mod init connect-qa
            install: go mod tidy
            port: 3000
            start: go run .

          - id: go-fiber
            kind: http
            snippets: go/fiber
            create: mkdir -p "$APP_DIR" && cd "$APP_DIR" && go mod init connect-qa
            install: go mod tidy
            port: 3000
            start: go run .

          # `--console plain`, not `--console=plain`: commander inherits the
          # environment by splitting on the first `=`, so an `=` anywhere in
          # SNIPPET_CMD truncates the value there (verified on commander
          # v2.5.0). Only the `run:` commands are affected - `start:` runs
          # straight from bash.
          - id: java
            kind: cli
            snippets: java/vanilla
            tools: java@temurin-21 gradle@8
            create: mkdir -p "$APP_DIR" && cp -R templates/java/. "$APP_DIR/"
            run: gradle run -q --console plain

          - id: java-spring
            kind: http
            snippets: java/spring
            tools: java@temurin-21 gradle@8
            create: mkdir -p "$APP_DIR" && cp -R templates/java-spring/. "$APP_DIR/"
            port: 8080
            start: gradle bootRun -q --console=plain

          # quarkusDev asks about build analytics on first run; opting out keeps
          # it from blocking on stdin.
          - id: java-quarkus
            kind: http
            snippets: java/quarkus
            tools: java@temurin-21 gradle@8
            create: mkdir -p "$APP_DIR" && cp -R templates/java-quarkus/. "$APP_DIR/"
            port: 8080
            start: gradle quarkusDev --console=plain -Dquarkus.analytics.disabled=true

          - id: kotlin
            kind: cli
            snippets: kotlin/vanilla
            tools: java@temurin-21 gradle@8
            create: mkdir -p "$APP_DIR" && cp -R templates/kotlin/. "$APP_DIR/"
            copy_to: src/main/kotlin
            run: gradle run -q --console plain

          - id: kotlin-ktor
            kind: http
            snippets: kotlin/ktor
            tools: java@temurin-21 gradle@8
            create: mkdir -p "$APP_DIR" && cp -R templates/kotlin-ktor/. "$APP_DIR/"
            port: 8080
            start: gradle run -q --console=plain

          - id: kotlin-spring
            kind: http
            snippets: kotlin/spring
            tools: java@temurin-21 gradle@8
            create: mkdir -p "$APP_DIR" && cp -R templates/kotlin-spring/. "$APP_DIR/"
            port: 8080
            start: gradle bootRun -q --console=plain

          - id: swift
            kind: cli
            snippets: swift/vanilla
            create: mkdir -p "$APP_DIR" && cp -R templates/swift/. "$APP_DIR/"
            copy_to: Sources
            run: swift run

          # Vapor pulls in BoringSSL, which takes minutes to compile; build it
          # up front so the readiness poll only covers process start.
          - id: swift-vapor
            kind: http
            snippets: swift/vapor
            create: mkdir -p "$APP_DIR" && cp -R templates/swift-vapor/. "$APP_DIR/"
            install: swift build
            port: 8080
            start: swift run

          # `dart create` rejects dashes in package names, so scaffold under
          # a valid name and move it into place. `dart_frog create` takes
          # --project-name instead, so it can scaffold straight into $APP_DIR.
          - id: dart
            kind: cli
            snippets: dart/vanilla
            create: dart create -t console "$RUNNER_TEMP/connect_qa" && mv "$RUNNER_TEMP/connect_qa" "$APP_DIR"
            install: dart pub add dart_appwrite
            run: dart run bin/main.dart

          - id: dart-frog
            kind: http
            snippets: dart/frog
            create: dart pub global activate dart_frog_cli && dart_frog create "$APP_DIR" --project-name connect_qa
            install: dart pub add dart_appwrite
            port: 8080
            start: dart_frog dev --port 8080

          - id: rust
            kind: cli
            snippets: rust/vanilla
            create: cargo new "$APP_DIR" --name connect-qa
            install: cargo add appwrite serde_json && cargo add tokio --features full
            run: cargo run -q

          - id: rust-axum
            kind: http
            snippets: rust/axum
            create: cargo new "$APP_DIR" --name connect-qa
            install: cargo add appwrite axum tokio -F tokio/full
            port: 3000
            start: cargo run -q

          - id: rust-actix
            kind: http
            snippets: rust/actix
            create: cargo new "$APP_DIR" --name connect-qa
            install: cargo add appwrite actix-web
            port: 3000
            start: cargo run -q

    steps:
      - uses: actions/checkout@v4

      - name: Check Appwrite variables and API key secret
        run: |
          if [ -z "$CODE_SNIPPET_QA_ENDPOINT" ] || [ -z "$CODE_SNIPPET_QA_PROJECT_ID" ] || [ -z "$CODE_SNIPPET_QA_API_KEY" ]; then
            echo "::error::Set the CODE_SNIPPET_QA_ENDPOINT and CODE_SNIPPET_QA_PROJECT_ID repository variables and the CODE_SNIPPET_QA_API_KEY repository secret."
            exit 1
          fi

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false

      - name: Install tooling via mise (hurl, commander, platform runtime)
        env:
          GITHUB_TOKEN: ${{ github.token }} # For Commander to install from GH
        run: |
          mise trust
          mise install
          if [ -n "${{ matrix.tools }}" ]; then
            mise use ${{ matrix.tools }}
          fi

      # 6.1, not 6.0: sdk-for-swift 20.x declares swift-tools-version 6.1 and
      # an older toolchain refuses to resolve it at all.
      - name: Install Swift
        if: startsWith(matrix.id, 'swift')
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.1"

      - name: Install Dart
        if: startsWith(matrix.id, 'dart')
        uses: dart-lang/setup-dart@v1

      # The runner's system Ruby has no bundler on PATH and an unwritable gem
      # dir, so `bundle init` and `gem install rails` both fail against it.
      - name: Install Ruby
        if: startsWith(matrix.id, 'ruby')
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Scaffold starter project
        run: |
          APP_DIR="app-$(date +%s)-$RANDOM"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          # Subshell: most scaffolds end with `cd "$APP_DIR"`, and letting that
          # leak would make the check below look for $APP_DIR inside itself.
          ( ${{ matrix.create }} )
          # Empty as well as missing: `composer create-project` creates the
          # directory before it resolves, so a failed resolve used to leave an
          # empty dir here and push the error into a later step.
          if [ ! -d "$APP_DIR" ] || [ -z "$(ls -A "$APP_DIR")" ]; then
            echo "::error::Scaffold did not produce a project in $APP_DIR"
            exit 1
          fi

      - name: Paste Connect snippets over the starter
        run: |
          SRC="$GITHUB_WORKSPACE/src/components/pages/projects/\$projectId/shared/connect-snippets/${{ matrix.snippets }}"
          DEST="$APP_DIR/${{ matrix.copy_to || '.' }}"
          mkdir -p "$DEST"
          cp -Rv "$SRC/." "$DEST/"
          # The Deno samples import the SDK through a template variable the
          # Connect dialog fills per package manager; pin it to npm here.
          find "$DEST" -type f -exec sed -i 's|{{DENO_SDK_SPECIFIER}}|npm:node-appwrite|g' {} +

      - name: Install dependencies + Appwrite SDK
        run: |
          cd "$APP_DIR"
          ${{ matrix.install }}

      - name: Start the sample server on :${{ matrix.port }}
        if: matrix.kind == 'http'
        run: |
          cd "$APP_DIR"
          nohup ${{ matrix.start }} > "$RUNNER_TEMP/server.log" 2>&1 &
          echo "Waiting for http://localhost:${{ matrix.port }}/v1/policies ..."
          # No -f: any HTTP response means the server is accepting
          # connections; Hurl does the real status/body assertions next.
          for i in $(seq 1 120); do
            if curl -s -o /dev/null "http://localhost:${{ matrix.port }}/v1/policies"; then
              echo "Server is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Server never became ready on :${{ matrix.port }}"
          tail -n 100 "$RUNNER_TEMP/server.log"
          exit 1

      - name: Assert the policy endpoints (Hurl)
        if: matrix.kind == 'http'
        run: |
          mkdir -p artifacts/hurl
          hurl --test \
            --variable base_url="http://localhost:${{ matrix.port }}" \
            --error-format long \
            --report-junit artifacts/hurl/report.xml \
            --report-html artifacts/hurl \
            policies.hurl

      - name: Assert the CLI output (commander)
        if: matrix.kind == 'cli'
        env:
          SNIPPET_CMD: ${{ matrix.run }}
        # No --verbose: it dumps the whole environment (API key included)
        # into the job log. Plain output already reports the failing
        # property, and the sample's own stderr is echoed above it.
        run: commander test commander.yaml

      - name: Collect logs and app source
        if: always()
        run: |
          mkdir -p artifacts
          cp "$RUNNER_TEMP/server.log" artifacts/server.log 2>/dev/null || true
          # The exact app that was tested (snippets pasted), ready to run
          # locally - dependency trees and build output excluded.
          if [ -n "$APP_DIR" ] && [ -d "$APP_DIR" ]; then
            zip -qr artifacts/app-source.zip "$APP_DIR" \
              -x "*/node_modules/*" "*/.git/*" "*/vendor/*" "*/.venv/*" \
              "*/target/*" "*/build/*" "*/.gradle/*" "*/obj/*" \
              "*/bin/Debug/*" "*/.dart_tool/*" "*/.build/*" "*/_fresh/*" \
              "*/.dart_frog/*" "*/storage/framework/*" "*/var/cache/*" \
              || true
          fi

      - name: Upload QA reports and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: connect-qa-server-${{ matrix.id }}
          path: tests/connect-qa/server/artifacts/
          if-no-files-found: warn
