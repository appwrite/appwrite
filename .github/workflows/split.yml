name: Split

# Pushes every packages/<name> to its read-only mirror at utopia-php/<name>
# on each push to main; a `<name>/<version>` tag pushes `<version>` to the
# mirror and publishes its GitHub release. A Rust crate is the same under the
# name rs/<name>: its directory goes to utopia-rs/<name>, and an
# `rs/<name>/<version>` tag releases it. See rfc/monorepo.md.

on:
  push:
    branches: [main]
    tags: ['*/*', 'rs/*/*']
  workflow_dispatch:
    inputs:
      force-crates:
        description: Overwrite the utopia-rs mirrors' main branches. Only for the first sync from main, which replaces the unrelated history pushed there on 2026-10-14.
        type: boolean
        default: false

# Per-ref so independent tag releases (each targets its own mirror) run in
# parallel instead of cancelling each other as pending; branch pushes to main
# still serialise under one group.
concurrency:
  group: split-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # the persisted GITHUB_TOKEN header would override the app token on push
          persist-credentials: false

      # A tag pushes one mirror; main pushes every package that carries a manifest.
      - name: Resolve mirrors
        id: mirrors
        run: |
          # <name>/<version> is a package, rs/<name>/<version> a crate. The other org's token
          # still needs one repository to be scoped to; it is not pushed to.
          packages=$(bin/monorepo list | awk '$1 !~ /^rs\// {print $1}' | paste -sd, -)
          crates=$(bin/monorepo list | awk '$1 ~ /^rs\// {sub(/^rs\//, "", $1); print $1}' | paste -sd, -)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            name="${GITHUB_REF_NAME%/*}"
            case "$name" in
              rs/*) crates="${name#rs/}" ;;
              *) packages="$name" ;;
            esac
          fi
          echo "repositories=$packages" >> "$GITHUB_OUTPUT"
          echo "crates=$crates" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.SPLIT_APP_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: utopia-php
          repositories: ${{ steps.mirrors.outputs.repositories }}
          permission-contents: write
          permission-workflows: write

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: crates-token
        with:
          app-id: ${{ vars.SPLIT_RS_APP_ID }}
          private-key: ${{ secrets.SPLIT_RS_APP_PRIVATE_KEY }}
          owner: utopia-rs
          repositories: ${{ steps.mirrors.outputs.crates }}
          permission-contents: write
          permission-workflows: write

      - name: Split packages and crates
        env:
          SPLIT_REMOTE_BASE: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/utopia-php
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SPLIT_CRATES_REMOTE_BASE: https://x-access-token:${{ steps.crates-token.outputs.token }}@github.com/utopia-rs
          CRATES_GH_TOKEN: ${{ steps.crates-token.outputs.token }}
          FORCE_CRATES: ${{ github.event_name == 'workflow_dispatch' && inputs.force-crates }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            bin/monorepo split "${GITHUB_REF_NAME%/*}" --tag="${GITHUB_REF_NAME##*/}"
          elif [ "$FORCE_CRATES" = "true" ]; then
            # shellcheck disable=SC2046
            bin/monorepo split $(bin/monorepo list | awk '$1 ~ /^rs\// {print $1}') --force
          else
            bin/monorepo split
          fi
