name: Split

# Pushes every packages/<name> to its read-only mirror at utopia-php/<name>
# on each push to main; a `<name>/<version>` tag pushes `<version>` to the
# mirror and publishes its GitHub release. See rfc/monorepo.md.

on:
  push:
    branches: [main]
    tags: ['*/*']
  workflow_dispatch:

# Per-ref so independent tag releases (each targets its own mirror) run in
# parallel instead of cancelling each other as pending; branch pushes to main
# still serialise under one group.
concurrency:
  group: split-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # the persisted GITHUB_TOKEN header would override the app token on push
          persist-credentials: false

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.SPLIT_APP_ID }}
          private-key: ${{ secrets.SPLIT_APP_PRIVATE_KEY }}
          owner: utopia-php

      - name: Split packages
        env:
          SPLIT_REMOTE_BASE: https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/utopia-php
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            bin/monorepo split "${GITHUB_REF_NAME%%/*}" --tag="${GITHUB_REF_NAME#*/}"
          else
            bin/monorepo split
          fi
