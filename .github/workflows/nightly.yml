name: "Nightly"

# Publishes the nightly channel for self-hosting: one build a day from the newest
# CI-green commit on the active release branch. Never publishes to appwrite/ce --
# Cloud builds from cl-* tags through publish.yml and is not part of this channel.
#
# Tags pushed (see the Releases section of AGENTS.md):
#   X.Y.Z-nightly.<date>  the rollback anchor, one per day
#   X.Y-nightly           rolling, per minor line. The form to recommend.
#   nightly               rolling, newest line only.

on:
  schedule:
    - cron: '0 0 * * *'  # 12am UTC daily
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to build (default: newest X.Y.x branch)'
        required: false
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # Invariant 4 in AGENTS.md: the nightly channel publishes here and nowhere else.
  IMAGE: appwrite/appwrite

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve build
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      branch: ${{ steps.resolve.outputs.branch }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Resolve branch, commit and version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          # The active release branch, unless workflow_dispatch named one.
          newest=$(git branch -r --format='%(refname:short)' \
            | sed -n 's#^origin/##p' \
            | grep -E '^[0-9]+\.[0-9]+\.x$' \
            | sort -V \
            | tail -1)

          if [ -z "$newest" ]; then
            echo "::error::No X.Y.x release branch found on origin."
            exit 1
          fi

          branch="${REQUESTED_BRANCH:-$newest}"

          if ! git rev-parse --verify "origin/${branch}" >/dev/null 2>&1; then
            echo "::error::Branch ${branch} does not exist on origin."
            exit 1
          fi

          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

          # Invariant 2: build the newest CI-green commit, not the tip, so a red
          # branch delays the channel instead of shipping through it.
          sha=$(gh run list \
            --workflow=ci.yml \
            --branch="${branch}" \
            --event=push \
            --status=success \
            --limit=1 \
            --json headSha \
            --jq '.[0].headSha // empty')

          if [ -z "$sha" ]; then
            echo "::warning::No green CI run found on ${branch}; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

          # Nothing new since the last nightly. The marker tag is moved by the
          # build job below and is the only state this workflow keeps.
          previous=$(git rev-parse -q --verify "refs/tags/nightly-${branch}^{commit}" || true)

          if [ "$previous" = "$sha" ]; then
            echo "::notice::${branch} has not moved since the last nightly (${sha}); skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A nightly is a prerelease of the next patch on the line, so read the
          # branch's own stable version and bump the patch.
          stable=$(git show "${sha}:app/init/constants.php" \
            | sed -n "s/^const APP_VERSION_STABLE = '\([^']*\)';.*/\1/p")

          if ! printf '%s' "$stable" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::APP_VERSION_STABLE on ${branch} is '${stable}', which is not a released X.Y.Z. Refusing to guess a nightly version."
            exit 1
          fi

          major=${stable%%.*}
          rest=${stable#*.}
          minor=${rest%%.*}
          patch=${rest#*.}

          version="${major}.${minor}.$((patch + 1))-nightly.$(date -u +%Y%m%d)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          tags="${IMAGE}:${version},${IMAGE}:${major}.${minor}-nightly"

          # The bare tag follows the newest line only, so a dispatched build of an
          # older branch cannot drag it backwards.
          if [ "${branch}" = "${newest}" ]; then
            tags="${tags},${IMAGE}:nightly"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          echo "Publishing ${tags//,/, } from ${branch} (${sha})." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and publish
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write  # moves the nightly-<branch> marker tag
    steps:
      - name: Checkout the resolved commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: production
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
          push: true
          tags: ${{ needs.resolve.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            io.appwrite.channel=nightly

      - name: Move the marker tag
        env:
          BRANCH: ${{ needs.resolve.outputs.branch }}
          SHA: ${{ needs.resolve.outputs.sha }}
        run: |
          set -euo pipefail
          git tag --force "nightly-${BRANCH}" "${SHA}"
          git push --force origin "nightly-${BRANCH}"
