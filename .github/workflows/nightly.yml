name: "Nightly"

# Publishes the nightly channel for self-hosting: one build a day from the newest
# CI-green commit on the active release branch. Never publishes to appwrite/ce --
# Cloud builds from cl-* tags through publish.yml and is not part of this channel.
#
# Tags pushed (see the Releases section of AGENTS.md):
#   X.Y-nightly.<date>  the day's build, to pin or roll back to
#   X.Y-nightly         rolling, per minor line. The form to recommend.
#   nightly             rolling, newest line only.
#
# The line comes from the branch name, not from APP_VERSION_STABLE: migrate keys
# off the constant compiled into the image, and VERSION only sets _APP_VERSION,
# so a nightly tag is a label rather than something the product reads.

on:
  schedule:
    - cron: '0 0 * * *'  # 12am UTC daily
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to build (default: newest X.Y.x branch)'
        required: false
        type: string

concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # Invariant 4 in AGENTS.md: the nightly channel publishes here and nowhere else.
  IMAGE: appwrite/appwrite

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve build
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.resolve.outputs.skip }}
      sha: ${{ steps.resolve.outputs.sha }}
      version: ${{ steps.resolve.outputs.version }}
      tags: ${{ steps.resolve.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Resolve branch, commit and version
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          # The active release branch, unless workflow_dispatch named one.
          branches=$(git ls-remote --heads origin \
            | sed -n 's#.*refs/heads/##p' \
            | grep -E '^[0-9]+\.[0-9]+\.x$' \
            | sort -V)
          newest=$(echo "$branches" | tail -1)
          branch="${REQUESTED_BRANCH:-$newest}"

          if ! echo "$branches" | grep -qx -- "$branch"; then
            echo "::error::'${branch}' is not an X.Y.x release branch on origin."
            exit 1
          fi

          line="${branch%.x}"

          # Invariant 2: build the newest CI-green commit, not the tip, so a red
          # branch delays the channel instead of shipping through it.
          sha=$(gh run list \
            --workflow=ci.yml \
            --branch="${branch}" \
            --event=push \
            --status=success \
            --limit=1 \
            --json headSha \
            --jq '.[0].headSha // empty')

          if [ -z "$sha" ]; then
            echo "::warning::No green CI run found on ${branch}; nothing to publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

          # An unchanged branch still gets a build: it picks up base image
          # security fixes, which is most of what a nightly is good for.
          version="${line}-nightly.$(date -u +%Y%m%d)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

          tags="${IMAGE}:${version},${IMAGE}:${line}-nightly"

          # The bare tag follows the newest line only, so a dispatched build of an
          # older branch cannot drag it backwards.
          if [ "${branch}" = "${newest}" ]; then
            tags="${tags},${IMAGE}:nightly"
          fi

          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

          echo "Publishing ${tags//,/, } from ${branch} (${sha})." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build and publish
    needs: resolve
    if: needs.resolve.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout the resolved commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          submodules: recursive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          target: production
          build-args: |
            VERSION=${{ needs.resolve.outputs.version }}
          push: true
          tags: ${{ needs.resolve.outputs.tags }}
          labels: |
            org.opencontainers.image.revision=${{ needs.resolve.outputs.sha }}
            org.opencontainers.image.version=${{ needs.resolve.outputs.version }}
            io.appwrite.channel=nightly
