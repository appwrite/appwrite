name: E2E

on:
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'static/**/*'

jobs:
  # The console keeps 10 sessions per user and deletes the oldest on overflow.
  # Signing in once here, instead of once per lane, keeps overlapping runs from
  # evicting each other's sessions mid-suite.
  session:
    name: session
    runs-on: gcrunner=${{ github.run_id }}-e2e-session/runner=checks
    timeout-minutes: 5
    steps:
      - name: Create console session
        env:
          VITE_APPWRITE_ENDPOINT: ${{ secrets.VITE_APPWRITE_ENDPOINT }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          jq -n --arg email "$E2E_TEST_EMAIL" --arg password "$E2E_TEST_PASSWORD" \
            '{email: $email, password: $password}' > credentials.json
          status=$(curl -sS -X POST "${VITE_APPWRITE_ENDPOINT%/}/account/sessions/email" \
            -H 'Content-Type: application/json' \
            -H 'X-Appwrite-Project: console' \
            --data @credentials.json \
            -D headers.txt -o body.json -w '%{http_code}')
          rm credentials.json
          if [ "$status" != 201 ]; then
            echo "::error::Console sign-in failed ($status): $(jq -r '.message // empty' body.json)"
            exit 1
          fi
          cookies=$(grep -i '^x-fallback-cookies:' headers.txt | cut -d' ' -f2- | tr -d '\r')
          if [ -z "$cookies" ]; then
            echo '::error::Console sign-in returned no X-Fallback-Cookies header'
            exit 1
          fi
          echo "::add-mask::$cookies"
          printf '%s' "$cookies" | openssl enc -aes-256-cbc -pbkdf2 -salt \
            -pass env:E2E_TEST_PASSWORD -out session.enc

      - uses: actions/upload-artifact@v4
        with:
          name: e2e-session
          path: session.enc
          retention-days: 1

  e2e:
    name: ${{ matrix.project }}
    needs: session
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: website
            args: --project=website
            timeout: 15
            runner: gcrunner=${{ github.run_id }}-e2e-website/runner=e2e
          - project: console-mocked
            args: --project=console-mocked
            timeout: 15
            runner: gcrunner=${{ github.run_id }}-e2e-console-mocked/runner=e2e
          - project: console
            args: --project=console
            timeout: 20
            runner: gcrunner=${{ github.run_id }}-e2e-console/runner=e2e
          - project: console-usage
            args: --project=console-usage
            timeout: 20
            runner: gcrunner=${{ github.run_id }}-e2e-console-usage/runner=e2e
          # Each database suite is one serial chain on a single worker, so they
          # only get faster by running on separate machines. A lane holds a
          # dedicated database open until it finishes, so it stays off spot.
          - project: console-mysql
            args: --project=console-mysql
            timeout: 40
            runner: gcrunner=${{ github.run_id }}-e2e-console-mysql/runner=e2e-long
          - project: console-postgres
            args: --project=console-postgres
            timeout: 40
            runner: gcrunner=${{ github.run_id }}-e2e-console-postgres/runner=e2e-long
          - project: console-tablesdb
            args: --project=console-tablesdb
            timeout: 40
            runner: gcrunner=${{ github.run_id }}-e2e-console-tablesdb/runner=e2e-long
          - project: console-documentsdb
            args: --project=console-documentsdb
            timeout: 40
            runner: gcrunner=${{ github.run_id }}-e2e-console-documentsdb/runner=e2e-long
          - project: console-vectorsdb
            args: --project=console-vectorsdb
            timeout: 40
            runner: gcrunner=${{ github.run_id }}-e2e-console-vectorsdb/runner=e2e-long
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      # System libraries live outside the cached browser directory.
      - name: Install Playwright system dependencies
        run: bunx playwright install-deps chromium

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install chromium

      - uses: actions/download-artifact@v4
        with:
          name: e2e-session

      - name: Load console session
        env:
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
        run: |
          cookies=$(openssl enc -d -aes-256-cbc -pbkdf2 -pass env:E2E_TEST_PASSWORD -in session.enc)
          rm session.enc
          echo "::add-mask::$cookies"
          echo "E2E_FALLBACK_COOKIES=$cookies" >> "$GITHUB_ENV"

      - name: E2E Tests
        env:
          VITE_APPWRITE_ENDPOINT: ${{ secrets.VITE_APPWRITE_ENDPOINT }}
          PUBLIC_CONSOLE_MODE: ${{ vars.PUBLIC_CONSOLE_MODE }}
          PUBLIC_APPWRITE_MULTI_REGION: ${{ vars.PUBLIC_APPWRITE_MULTI_REGION }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          # Required to resume paused free-plan projects (baked into the webServer build).
          VITE_CONSOLE_FINGERPRINT_KEY: ${{ secrets.VITE_CONSOLE_FINGERPRINT_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_SESSION_SECRET: ${{ secrets.E2E_TEST_SESSION_SECRET }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          E2E_PROJECT_ID: ${{ secrets.E2E_PROJECT_ID }}
        run: bun run e2e -- ${{ matrix.args }}
