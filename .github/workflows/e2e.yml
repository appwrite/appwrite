name: E2E

on:
  pull_request:
    branches: ['**']
    paths-ignore:
      - '**/*.md'
      - 'static/**/*'

jobs:
  e2e:
    name: ${{ matrix.project }}
    runs-on: runs-on=${{ github.run_id }}/runner=e2e
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: website
            timeout: 15
          - project: console
            timeout: 15
          - project: console-mocked
            timeout: 15
          - project: console-usage
            timeout: 20
          - project: console-mysql
            timeout: 40
          - project: console-postgres
            timeout: 40
          - project: console-tablesdb
            timeout: 25
          - project: console-documentsdb
            timeout: 40
          - project: console-vectorsdb
            timeout: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium

      - name: E2E Tests
        env:
          VITE_APPWRITE_ENDPOINT: ${{ secrets.VITE_APPWRITE_ENDPOINT }}
          PUBLIC_CONSOLE_MODE: ${{ vars.PUBLIC_CONSOLE_MODE }}
          PUBLIC_APPWRITE_MULTI_REGION: ${{ vars.PUBLIC_APPWRITE_MULTI_REGION }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ secrets.VITE_STRIPE_PUBLISHABLE_KEY }}
          # Required to resume paused free-plan projects (baked into the webServer build).
          VITE_CONSOLE_FINGERPRINT_KEY: ${{ secrets.VITE_CONSOLE_FINGERPRINT_KEY }}
          E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_SESSION_SECRET: ${{ secrets.E2E_TEST_SESSION_SECRET }}
          E2E_ORG_ID: ${{ secrets.E2E_ORG_ID }}
          E2E_PROJECT_ID: ${{ secrets.E2E_PROJECT_ID }}
        run: bun run e2e -- --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: ${{ failure() && !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7
