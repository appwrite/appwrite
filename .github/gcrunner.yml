# Presets a workflow selects with runner=<name>. No preset pins an image: a
# pinned build that the image workflow prunes leaves jobs queued forever.
runners:
  checks:
    family: c3d
    cpu: 4
    ram: 16
    disk: 80gb

  e2e:
    family: c3d
    cpu: 4
    ram: 16
    disk: 80gb

  # A preempted database lane leaks its dedicated database.
  e2e-long:
    family: c3d
    cpu: 4
    ram: 16
    disk: 80gb
    spot: false

  # A preempted build leaves a half-pushed digest.
  build:
    family: c3d
    cpu: 4
    ram: 16
    disk: 80gb
    spot: false

  deploy:
    family: c3d
    cpu: 4
    ram: 8
    disk: 80gb
    spot: false

  snippets-qa:
    family: c3d
    cpu: 4
    ram: 16
    disk: 80gb
