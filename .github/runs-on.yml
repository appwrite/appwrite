runners:
  # Connect snippets QA (web + server): scaffold a starter app, paste the
  # snippets, build and assert. The full image mirrors GitHub's ubuntu-latest
  # tooling (python, php, ruby, go, rust, dotnet, ...), which the server
  # workflow relies on.
  snippets-qa:
    cpu: 4
    family: [c7i, c7a, m7i, m7a]
    image: ubuntu24-full-x64
    volume: 80gb

  # Connect snippets QA (Android): Gradle builds plus an x86_64 emulator.
  # The emulator needs KVM, which on AWS requires nested virtualization -
  # only the c8i/m8i/r8i families support it (RunsOn v2.12.2+).
  snippets-qa-android:
    cpu: 8
    family: [c8i, m8i]
    image: ubuntu24-full-x64
    volume: 80gb
    nested-virt: true
