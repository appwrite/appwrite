# Appwrite Rust workspace.
#
# Lives next to the PHP code in the appwrite/appwrite monorepo. Rust crates are
# kept out of `packages/` (that directory is reserved for Composer packages and
# is wired into the PHP CI, autoloader and Docker image).
#
#   crates/utopia/<name>    Generic Utopia libraries (Rust equivalents of packages/<name>)
#   crates/appwrite/<name>  Appwrite domain crates: core, service modules, server binary
#   crates/support/<name>   Support crates shared by Utopia crates: php-std (PHP engine semantics)
#   crates/tools/<name>     Development tools (not shipped): compat, the PHP/Rust differential tester
#
# See rfc/rust.md for the migration plan and crates/CONVERSION.md for the
# standard each Utopia crate is converted to.
[workspace]
resolver = "3"
members = ["crates/utopia/*", "crates/appwrite/*", "crates/support/*", "crates/tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/appwrite/appwrite"
publish = false

[workspace.dependencies]
# Support crates
php-std = { path = "crates/support/php-std" }

# Utopia crates
utopia-system = { path = "crates/utopia/system" }
utopia-validators = { path = "crates/utopia/validators" }
utopia-http = { path = "crates/utopia/http" }
utopia-database = { path = "crates/utopia/database" }
utopia-cache = { path = "crates/utopia/cache" }
utopia-queue = { path = "crates/utopia/queue" }
utopia-lock = { path = "crates/utopia/lock" }
utopia-auth = { path = "crates/utopia/auth" }
utopia-emails = { path = "crates/utopia/emails" }
utopia-locale = { path = "crates/utopia/locale" }
utopia-user-agent = { path = "crates/utopia/user-agent" }
utopia-dsn = { path = "crates/utopia/dsn" }

# Appwrite crates
appwrite-core = { path = "crates/appwrite/core" }
appwrite-users = { path = "crates/appwrite/users" }

# Third party
aes = "0.8"
aes-gcm = "0.10"
argon2 = { version = "0.5", features = ["std"] }
base64 = "0.22"
bcrypt = "0.17"
brotli = { version = "8", default-features = false, features = ["std"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
crc32fast = "1"
ctr = "0.9"
deadpool-postgres = "0.14"
fancy-regex = "0.14"
flate2 = "1"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await-macro"] }
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
indexmap = "2"
# UTS #46 mapping and Unicode properties at the Unicode version of PHP's ICU
# (php-std's idn_to_ascii/idn_to_utf8); pure Rust, from the ICU project.
icu_normalizer = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_properties = { version = "2.3", default-features = false, features = ["compiled_data"] }
md-5 = "0.10"
# NIST P-256 ECDSA (ES256 passkeys, utopia-auth); RustCrypto, pure Rust.
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "pkcs8", "std"] }
mimalloc = { version = "0.1", default-features = false }
redis = { version = "0.32", default-features = false, features = ["tokio-comp", "aio", "connection-manager", "script"] }
regex = "1"
# RSA PKCS#1 v1.5 signatures and PEM keys (RS256 JWTs and passkeys, utopia-auth); RustCrypto, pure Rust.
rsa = { version = "0.9", features = ["sha2", "getrandom"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustix = { version = "1", default-features = false, features = ["std", "fs", "system"] }
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-postgres = { version = "0.7.12", features = ["with-chrono-0_4", "with-serde_json-1"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
zstd = { version = "0.13", default-features = false }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev.package."*"]
opt-level = 2
