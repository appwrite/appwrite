rules:
  - id: php.appwrite.secret-compare-timing
    message: >
      Secret, OTP, signature, or verification code compared with == / === /
      != / !== / strcmp(). Use hash_equals($known, $provided) so comparison
      time does not depend on how many leading characters match.
    languages: [php]
    severity: WARNING
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/**"
        - "**/app/controllers/**"
        - "**/app/init/**"
      exclude:
        - "**/app/controllers/mock.php"
    patterns:
      - pattern-either:
          - pattern: $SECRET === $OTHER
          - pattern: $SECRET == $OTHER
          - pattern: $SECRET !== $OTHER
          - pattern: $SECRET != $OTHER
          - pattern: $OTHER === $SECRET
          - pattern: $OTHER == $SECRET
          - pattern: $OTHER !== $SECRET
          - pattern: $OTHER != $SECRET
          - pattern: strcmp($SECRET, $OTHER)
          - pattern: \strcmp($SECRET, $OTHER)
          - pattern: strcmp($OTHER, $SECRET)
          - pattern: \strcmp($OTHER, $SECRET)
      - metavariable-regex:
          metavariable: $SECRET
          regex: (?i)^(?:\$[a-z_]*(?:secret|signature|otp|hmac|digest)[a-z_]*|\$(?:code|verificationCode)|.*->getAttribute\(\s*['"](?:secret|code|signature)['"]\s*(?:,[^)]*)?\))$
      - metavariable-pattern:
          metavariable: $OTHER
          patterns:
            - pattern-not: "null"
            - pattern-not: "true"
            - pattern-not: "false"
            - pattern-not: "''"
            - pattern-not: '""'
            - pattern-not: "[]"
            - pattern-not: $CLASS::$CONSTANT
            - pattern-not-regex: ^-?[0-9]+$
            - pattern-not-regex: ^(?:'[^']*'|"[^"]*")$
            - pattern-regex: (?s).+
