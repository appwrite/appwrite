rules:
  - id: php.appwrite.weak-secret-env-default
    message: >
      Secret-like env var (*SECRET*, *KEY*, *PASS*, *PASSWORD*, *TOKEN*)
      read with a non-empty literal default. If the variable is unset the
      process silently runs with a shared, guessable value. Default to ''
      and fail or disable the feature when it is empty.
    languages: [php]
    severity: WARNING
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/**"
        - "**/app/controllers/**"
        - "**/app/init/**"
      exclude:
        - "**/src/Appwrite/Platform/Tasks/Doctor.php"
    patterns:
      - pattern-either:
          - pattern: System::getEnv($NAME, $DEFAULT)
          - pattern: \Utopia\System\System::getEnv($NAME, $DEFAULT)
          - pattern: "getenv($NAME) ?: $DEFAULT"
      - metavariable-regex:
          metavariable: $NAME
          regex: ^['"][A-Z0-9_]*(?:SECRET|_KEY|PASS|PASSWORD|TOKEN)[A-Z0-9_]*['"]$
      - metavariable-regex:
          metavariable: $DEFAULT
          regex: ^['"][^'"]+['"]$
      - metavariable-regex:
          metavariable: $NAME
          regex: ^['"](?![A-Z0-9_]*(?:_ALGORITHM|_PUBLIC_KEY|_KEY_ID|_KEY_TYPE|_TTL|_EXPIRY|_DSN|_URL|_URI|_HOST|_ENDPOINT|_PATH|_ENABLED|_LENGTH)['"])
