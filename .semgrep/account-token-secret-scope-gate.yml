rules:
  - id: php.appwrite.account-token-secret-scope-gate
    message: >
      Handlers that inject an API key and return MODEL_TOKEN or MODEL_SESSION
      (both expose a sensitive secret) must clear that secret unless the key
      has users.write. Do not rely on the default “any key sees sensitive
      fields” behavior for minted credentials.
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/**"
        - "**/app/controllers/**"
    patterns:
      - pattern-either:
          - pattern: $RESPONSE->dynamic($TOKEN, Response::MODEL_TOKEN)
          - pattern: $RESPONSE->dynamic($TOKEN, Response::MODEL_SESSION)
      - pattern-either:
          - pattern-inside: |
              function (..., ?Key $APIKEY) {
                ...
              }
          - pattern-inside: |
              function (..., Key $APIKEY) {
                ...
              }
      - pattern-not-inside: |
          function (..., ?Key $APIKEY) {
            ...
            if ($APIKEY !== null && !\in_array('users.write', $APIKEY->getScopes())) {
              ...
            }
            ...
          }
      - pattern-not-inside: |
          function (..., Key $APIKEY) {
            ...
            if (!\in_array('users.write', $APIKEY->getScopes())) {
              ...
            }
            ...
          }
      - pattern-not-inside: |
          function (..., ?Key $APIKEY) {
            ...
            if ($APIKEY !== null && !in_array('users.write', $APIKEY->getScopes())) {
              ...
            }
            ...
          }
