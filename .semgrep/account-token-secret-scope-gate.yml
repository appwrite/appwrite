rules:
  - id: php.appwrite.account-token-secret-scope-gate
    message: >
      Account token and recovery routes that accept an API key must clear
      `secret` unless the key has users.write, before returning MODEL_TOKEN.
      Keys with only sessions.write should not read back minted secrets.
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/app/controllers/api/account.php"
        - "**/src/Appwrite/Platform/Modules/Account/**"
    patterns:
      - pattern: $RESPONSE->dynamic($TOKEN, Response::MODEL_TOKEN)
      - pattern-inside: |
          function (..., ?Key $APIKEY) {
            ...
          }
      - pattern-not-inside: |
          function (..., ?Key $APIKEY) {
            ...
            if ($APIKEY !== null && !\in_array('users.write', $APIKEY->getScopes())) {
              ...
            }
            ...
          }
