rules:
  - id: php.appwrite.account-token-secret-scope-gate
    message: >
      Handlers that inject an API key and return a token, session, or JWT
      model (all expose a secret) must clear that secret unless the key
      has users.write. Do not rely on the default “any key sees sensitive
      fields” behavior for minted credentials. Closures and Module
      action() methods with Key / ?Key anywhere in the signature are in
      scope; the gate is any preceding if (...) that checks users.write.
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/**"
        - "**/app/controllers/**"
    patterns:
      - pattern-either:
          - pattern: $RESPONSE->dynamic($TOKEN, Response::$MODEL)
          - pattern: $RESPONSE->output($TOKEN, Response::$MODEL)
      - metavariable-regex:
          metavariable: $MODEL
          regex: ^MODEL_(?:TOKEN|SESSION|JWT)$
      - pattern-either:
          - pattern-inside: |
              function (..., ?Key $APIKEY, ...) { ... }
          - pattern-inside: |
              function (..., Key $APIKEY, ...) { ... }
          - pattern-inside: |
              function $ACTION(..., ?Key $APIKEY, ...) { ... }
          - pattern-inside: |
              function $ACTION(..., Key $APIKEY, ...) { ... }
      - pattern-not-inside: $QUEUE->setPayload(...)
      - pattern-not-inside: |
          if (<... in_array('users.write', $KEY->getScopes(), ...) ...>) { ... }
          ...
      - pattern-not-inside: |
          if (<... \in_array('users.write', $KEY->getScopes(), ...) ...>) { ... }
          ...
