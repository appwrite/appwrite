rules:
  - id: php.appwrite.skip-sensitive-collection
    message: >
      Unconditional Authorization skip around getDocument/find/findOne of
      ACL-bearing collections (transactions, sessions, tokens, or files).
      Gate the skip on API-key / privileged callers, or load with document
      ACL. Metadata skips are out of scope for this ERROR rule; see
      skip-ungated-load for the broader WARNING class.
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/Platform/Modules/**"
        - "**/app/controllers/**"
    patterns:
      - pattern-either:
          - pattern: $AUTH->skip($CB)
          - pattern: Authorization::skip($CB)
      - metavariable-regex:
          metavariable: $CB
          regex: (?s).*(?:getDocument|find|findOne)\(\s*['\"](?:transactions|sessions|tokens|files)['\"]
      - pattern-not-inside: |
          ($IS_KEY || $IS_PRIVILEGED) ? $AUTH->skip(...) : $OTHER
      - pattern-not-inside: |
          if ($IS_KEY || $IS_PRIVILEGED) {
            ...
            $AUTH->skip(...);
            ...
          } else {
            ...
          }
