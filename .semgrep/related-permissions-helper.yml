rules:
  - id: php.appwrite.related-permissions-helper
    message: >
      Nested / related-document $permissions reads or writes must go through
      validateRelatedPermissions() so a caller cannot grant roles they do
      not hold. Applies to Databases, TablesDB, DocumentsDB, VectorsDB, and
      transaction operations. Top-level collection or primary-document
      permission updates are not this rule.
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/Platform/Modules/Databases/**"
    patterns:
      - pattern-either:
          - pattern: $REL->getAttribute('$permissions')
          - pattern: $REL->setAttribute('$permissions', ...)
          - pattern: $REL['$permissions']
      - metavariable-regex:
          metavariable: $REL
          regex: \$(?:relation|related|nested|child|peer)\b
      - pattern-not-inside: |
          $this->validateRelatedPermissions(...)
