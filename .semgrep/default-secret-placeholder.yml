rules:
  - id: php.appwrite.default-secret-placeholder
    message: >
      Placeholder secret literals such as `your-secret-key` do not belong
      in production PHP. Read secrets from env with no insecure default,
      and keep installer examples in app/config/variables.php or Doctor.
    languages: [php]
    severity: WARNING
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/**"
        - "**/app/controllers/**"
        - "**/app/init/**"
      exclude:
        - "**/src/Appwrite/Platform/Tasks/Doctor.php"
    pattern-either:
      - pattern: System::getEnv($NAME, 'your-secret-key')
      - pattern: "'your-secret-key'"
      - pattern: '"your-secret-key"'
