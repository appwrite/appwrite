rules:
  - id: php.appwrite.default-secret-placeholder
    message: >
      Placeholder secret literals (your-secret-key, your-api-key, changeme,
      change-me, replace-me, insecure-*, …) do not belong in production PHP.
      Read secrets from env with no insecure default, and keep installer
      examples in app/config/variables.php or Doctor.
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/**"
        - "**/app/controllers/**"
        - "**/app/init/**"
      exclude:
        - "**/src/Appwrite/Platform/Tasks/Doctor.php"
    pattern-either:
      # Rejecting a known placeholder is fine: a `PLACEHOLDER` constant, a
      # comparison against it, or a warning / exception naming it. Any other
      # use (env default, assignment, return) still matches, including uses
      # of the constant through constant propagation.
      - patterns:
          - pattern: '"$LITERAL"'
          - metavariable-regex:
              metavariable: $LITERAL
              regex: (?i)^(?:your[-_](?:secret|api|app|jwt|encryption|private)[-_]?(?:key|secret|token)?|change[-_]?me|replace[-_]?me|insecure[-_](?:secret|key|password|token)|super[-_]?secret|secret[-_]?key[-_]?here|default[-_]secret)$
          - pattern-not-inside: 'const PLACEHOLDER = "...";'
          - pattern-not-inside: '$A === $B'
          - pattern-not-inside: '$A !== $B'
          - pattern-not-inside: 'Console::$LEVEL(...)'
          - pattern-not-inside: 'throw new $EXCEPTION(...);'
      # Constant propagation does not cross files, so catch another class's
      # PLACEHOLDER used as an env default directly.
      - patterns:
          - pattern: 'System::getEnv($NAME, $CLASS::PLACEHOLDER)'
          - pattern-not: 'System::getEnv($NAME, self::PLACEHOLDER)'
          - pattern-not: 'System::getEnv($NAME, static::PLACEHOLDER)'
