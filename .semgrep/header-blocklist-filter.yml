rules:
  - id: php.appwrite.header-blocklist-filter
    message: >
      Filter forwarded request headers or hosts with an allowlist, not a
      BLOCKED_*/DENIED_*/DISALLOWED_*/FORBIDDEN_* list of known-bad names.
      New names will not be on a blocklist. Prefer
      FUNCTION_ALLOWLIST_HEADERS_* or a named ALLOWED_HEADERS constant.
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/Platform/Modules/**"
        - "**/app/controllers/**"
    patterns:
      - pattern-either:
          - pattern: const $NAME = $LIST;
          - pattern: $NAME = $LIST;
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)\$?(?:.*(?:BLOCKED|DENIED|DENY|DISALLOWED|FORBIDDEN).*(?:HEADER|HOST).*|.*(?:HEADER|HOST).*(?:BLOCKED|DENIED|DENY|DISALLOWED|FORBIDDEN).*)
