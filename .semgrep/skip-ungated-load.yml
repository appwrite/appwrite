rules:
  - id: php.appwrite.skip-ungated-load
    message: >
      Unconditional Authorization skip whose body loads a document
      (getDocument/find/findOne) from a named collection outside the
      allowlist. Gate the skip on API-key / privileged callers, or load
      with document ACL. Allowlisted: schema/platform metadata, generated
      tables (bucket_*, database_*), existing lookup collections
      (users, teams, memberships, …), and subquery hydrations
      (sessions, tokens, challenges, authenticators, insights,
      resourceTokens, pushLedger).
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/**"
        - "**/app/controllers/**"
        - "**/app/init/**"
    patterns:
      - pattern-either:
          - pattern: $AUTH->skip($CB)
          - pattern: Authorization::skip($CB)
      - metavariable-regex:
          metavariable: $CB
          regex: (?s).*(?:getDocument|find|findOne)\(\s*['\"](?!(?:databases|collections|attributes|indexes|tables|columns|projects|platforms|keys|webhooks|rules|buckets|functions|deployments|sites|builds|installations|repositories|vcsComments|schedules|variables|migrations|executions|topics|messages|providers|logs|cache|certificates|transactionLogs|notifications|users|teams|memberships|identities|targets|subscribers|sessions|tokens|challenges|authenticators|insights|resourceTokens|pushLedger|bucket_|database_)['\"_])[^'\"]+['\"]
      - pattern-not-inside: |
          ($IS_KEY || $IS_PRIVILEGED) ? $AUTH->skip(...) : $OTHER
      - pattern-not-inside: |
          if ($IS_KEY || $IS_PRIVILEGED) {
            ...
            $AUTH->skip(...);
            ...
          } else {
            ...
          }
