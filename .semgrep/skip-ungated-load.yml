rules:
  - id: php.appwrite.skip-ungated-load
    message: >
      Unconditional Authorization skip whose body loads a document
      (getDocument/find/findOne) from a named collection outside the
      allowlist. Gate the skip on API-key / privileged callers, or load
      with document ACL. Allowlisted: schema/platform metadata, generated
      tables (bucket_*, database_*), existing lookup collections
      (users, teams, memberships, …), subquery hydrations
      (sessions, tokens, challenges, authenticators, insights,
      resourceTokens, pushLedger), and video child / profile collections
      (videos_profiles, videos_renditions, videos_captions,
      videos_previews, videos_subtitles, and their _segments tables).
      A videos load (getDocument/find/findOne) in a function that also
      calls assertFileAccess (play / cache) is allowed. Another collection
      in that function is still an error.
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/**"
        - "**/app/controllers/**"
        - "**/app/init/**"
    patterns:
      - pattern-either:
          - pattern: $AUTH->skip($CB)
          - pattern: Authorization::skip($CB)
      - metavariable-regex:
          metavariable: $CB
          regex: (?s).*(?:getDocument|find|findOne)\(\s*['\"](?!(?:databases|collections|attributes|indexes|tables|columns|projects|platforms|keys|webhooks|rules|buckets|functions|deployments|sites|builds|installations|repositories|vcsComments|schedules|variables|migrations|executions|topics|messages|providers|logs|cache|certificates|transactionLogs|notifications|users|teams|memberships|identities|targets|subscribers|sessions|tokens|challenges|authenticators|insights|resourceTokens|pushLedger|videos_profiles|videos_renditions|videos_captions|videos_previews|videos_subtitles|bucket_|database_)['\"_])[^'\"]+['\"]
      - pattern-not-inside: |
          ($IS_KEY || $IS_PRIVILEGED) ? $AUTH->skip(...) : $OTHER
      - pattern-not-inside: |
          if ($IS_KEY || $IS_PRIVILEGED) {
            ...
            $AUTH->skip(...);
            ...
          } else {
            ...
          }
      # Play / cache exemption: a videos load inside a function that calls
      # assertFileAccess. Semgrep's PHP parser rejects `fn () =>` in
      # patterns, so this is the negation of (videos load AND play function)
      # instead of pattern-not-inside on the arrow. Either the callback is
      # not a videos load, or the skip is outside both function forms.
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $AUTH->skip($CB)
                  - pattern: Authorization::skip($CB)
              - metavariable-regex:
                  metavariable: $CB
                  regex: (?s)^(?!.*(?:getDocument|findOne|find)\(\s*['\"]videos['\"]).*$
          - patterns:
              - pattern-either:
                  - pattern: $AUTH->skip($CB)
                  - pattern: Authorization::skip($CB)
              - pattern-not-inside: |
                  function $F(...) {
                    ...
                    $CLASS::assertFileAccess(...);
                    ...
                  }
              - pattern-not-inside: |
                  function (...) {
                    ...
                    $CLASS::assertFileAccess(...);
                    ...
                  }
