rules:
  - id: php.appwrite.skip-ungated-userdata
    message: >
      Unconditional Authorization skip around getDocument/find/findOne of
      users, memberships, identities, or targets. Many current call sites
      are intentional (token verify, subscriber lookup). Prefer a ternary
      gated on API-key / privileged callers, or a follow-up ACL check.
    languages: [php]
    severity: WARNING
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/Platform/Modules/**"
        - "**/app/controllers/**"
    patterns:
      - pattern: $AUTH->skip($CB)
      - metavariable-regex:
          metavariable: $CB
          regex: (?s).*(?:getDocument|find|findOne)\(\s*['\"](?:users|memberships|identities|targets)['\"]
      - pattern-not-inside: |
          ($IS_KEY || $IS_PRIVILEGED) ? $AUTH->skip(...) : $OTHER
      - pattern-not-inside: |
          if ($IS_KEY || $IS_PRIVILEGED) {
            ...
            $AUTH->skip(...);
            ...
          } else {
            ...
          }
