rules:
  - id: php.appwrite.route-without-scope
    message: >
      Every /v1 HTTP route must declare ->label('scope', ...). The shared
      api init hook resolves the caller's allowed scopes against this
      label; a route without one has no scope requirement at all. Use
      'public' explicitly when the route is meant to be open.
    languages: [php]
    severity: ERROR
    metadata:
      category: correctness
      technology: [php]
    paths:
      include:
        - "**/src/Appwrite/Platform/Modules/**"
        - "**/app/controllers/**"
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $ROUTE->callback(...)
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: (?s).*->setHttpPath\(\s*['"]/v1/
          - patterns:
              - pattern: $ROUTE->action(...)
              - metavariable-regex:
                  metavariable: $ROUTE
                  regex: (?s)^\\?(?:Utopia\\Http\\)?Http::(?:get|post|put|patch|delete)\(\s*['"]/v1/
      - pattern-not-regex: ->label\(\s*['"]scope['"]
