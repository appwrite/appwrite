[package]
name = "utopia-websocket"
description = "WebSocket servers behind one adapter interface (Tokio, in-memory), with hooks, fan-out sends and error stages, and a WebSocket client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/utopia-rs/websocket"
publish.workspace = true

[features]
default = ["tokio"]
# The network adapter (`Tokio`) and the client's network transport
# (`Client::connect`), on tokio and tokio-tungstenite.
tokio = ["dep:tokio", "dep:tokio-tungstenite", "dep:httparse"]

[dependencies]
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
http.workspace = true
indexmap.workspace = true
php-std.workspace = true
thiserror.workspace = true
httparse = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["net", "rt", "sync", "time", "io-util", "macros"] }
tokio-tungstenite = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }

[package.metadata.utopia]
php-sync = "809d2819d7da00d8b2f486e3bcb4c98a5265e950"
