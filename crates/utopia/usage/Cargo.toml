[package]
name = "utopia-usage"
description = "Usage metrics: events summed and gauges sampled, written in batches and read as totals, time series and dimensional breakdowns over ClickHouse or a utopia-database collection; canonical samples with completeness evidence."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository = "https://github.com/utopia-rs/usage"
publish.workspace = true

[features]
default = ["clickhouse"]
# The ClickHouse adapter, over HTTP through a `Transport` the caller supplies.
clickhouse = ["dep:utopia-validators"]

[dependencies]
async-trait.workspace = true
getrandom.workspace = true
hex.workspace = true
indexmap.workspace = true
md-5.workspace = true
php-std.workspace = true
sha2.workspace = true
utopia-query.workspace = true
utopia-validators = { workspace = true, optional = true }

[package.metadata.utopia]
category = "observability"
php-sync = "2beb6a1c1dbdfeffdcb0db7da671b56923b7a98c"
