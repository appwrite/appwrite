[package]
name = "utopia-auth"
description = "The password hash algorithms of utopia-php/auth: PECL scrypt, Firebase's modified scrypt and phpass."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/auth"

[dependencies]
# AES-256 for Firebase's modified scrypt (openssl_encrypt aes-256-ctr in PHP).
aes = "0.8"
# random_bytes() and password_hash()'s salts.
getrandom = "0.3"
md-5 = "0.10"
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
sha2 = "0.10"
zeroize = "1"

[package.metadata.utopia]
category = "security"
php-sync = "57748900ad9d8217892a42d315ad025b2ecaf5dc"
