[package]
name = "utopia-schedule"
description = "A scheduler that reconciles schedules from a source of truth and dispatches cron, interval, delayed and fixed-time occurrences without silently skipping a run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
getrandom.workspace = true
indexmap.workspace = true
php-std.workspace = true
redis.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
utopia-telemetry.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
