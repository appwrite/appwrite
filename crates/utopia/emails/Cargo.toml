[package]
name = "utopia-emails"
description = "Email addresses split, checked and made canonical per provider, and their domains classified as free or disposable."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/emails"

[dependencies]
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
thiserror = "2"

[package.metadata.utopia]
category = "utilities"
php-sync = "7b0d70bc62"
