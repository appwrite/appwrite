[package]
name = "utopia-locale"
description = "Translations: languages, default and fallback locales, and placeholders."
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "BSD-3-Clause"
repository = "https://github.com/utopia-rs/locale"

[dependencies]
foldhash = "0.2"
indexmap = { version = "2", features = ["serde"] }
serde = "1"
php-std = { version = "0.1.0", git = "https://github.com/utopia-rs/php-std" }
serde_json = { version = "1", features = ["raw_value", "preserve_order", "float_roundtrip"] }
thiserror = "2"


[package.metadata.utopia]
category = "utilities"
php-sync = "8262340175d02fc1f4a905dd5b81498c4eb5006c"
