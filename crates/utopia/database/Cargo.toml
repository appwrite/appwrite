[package]
name = "utopia-database"
description = "Document database: collections, attributes, indexes, documents, queries, permissions, relationships and tenancy over pluggable adapters (PostgreSQL, SQLite, in-memory)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["postgres"]
# The PostgreSQL adapter (and the legacy row-level layer, also PostgreSQL).
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:postgres-protocol", "dep:fallible-iterator"]
# The SQLite adapter (rusqlite, with SQLite built in).
sqlite = ["dep:rusqlite"]
# The in-memory adapter.
memory = []

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
deadpool-postgres = { workspace = true, optional = true }
fallible-iterator = { workspace = true, optional = true }
postgres-protocol = { workspace = true, optional = true }
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
md-5.workspace = true
php-std.workspace = true
rusqlite = { workspace = true, optional = true }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "net", "io-util"] }
tokio-postgres = { workspace = true, optional = true }
tracing.workspace = true
utopia-cache.workspace = true
utopia-validators.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }

[package.metadata.utopia]
category = "data"
