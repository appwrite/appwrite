[package]
name = "utopia-database"
description = "Document database: collections, attributes, indexes, documents, queries, permissions, relationships and tenancy over pluggable adapters (PostgreSQL)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["postgres"]
# The PostgreSQL adapter (and the legacy row-level layer, also PostgreSQL).
postgres = ["dep:tokio-postgres", "dep:deadpool-postgres", "dep:postgres-protocol", "dep:fallible-iterator"]
# The Pool adapter: each call on a connection of a utopia-pools pool of adapters.
pool = ["dep:utopia-pools"]
# The Redis adapter: documents stored in Redis (redis-rs, as utopia-cache uses).
redis = ["dep:redis"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
deadpool-postgres = { workspace = true, optional = true }
fallible-iterator = { workspace = true, optional = true }
postgres-protocol = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
futures-util.workspace = true
getrandom.workspace = true
hex.workspace = true
md-5.workspace = true
php-std.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "net", "io-util"] }
tokio-postgres = { workspace = true, optional = true }
tracing.workspace = true
utopia-cache.workspace = true
utopia-pools = { workspace = true, optional = true }
utopia-validators.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["sync", "time", "rt", "macros", "rt-multi-thread"] }

[package.metadata.utopia]
category = "data"
