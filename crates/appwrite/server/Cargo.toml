[package]
name = "appwrite-server"
description = "Appwrite Rust API server (runs side by side with the PHP API)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Stays in this repository: only crates/utopia is published.
publish = false

[[bin]]
name = "appwrite-rust"
path = "src/main.rs"

[dependencies]
appwrite-account.workspace = true
appwrite-core.workspace = true
appwrite-users.workspace = true
appwrite-teams.workspace = true
appwrite-storage.workspace = true
mimalloc.workspace = true
serde_json.workspace = true
utopia-async.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utopia-http.workspace = true
