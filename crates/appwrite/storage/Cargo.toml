[package]
name = "appwrite-storage"
description = "Appwrite Storage service (/v1/storage) for the Rust API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# Stays in this repository: only crates/utopia is published.
publish = false

[dependencies]
appwrite-core.workspace = true
bytes.workspace = true
futures-util.workspace = true
base64.workspace = true
hex.workspace = true
md-5.workspace = true
indexmap.workspace = true
php-std.workspace = true
# Uploads::claim_scan spreads its scans (PHP: random_int).
rand.workspace = true
# Uploads, on the lock pool's Redis (PHP: Appwrite\Storage\Uploads).
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
utopia-async.workspace = true
utopia-client.workspace = true
utopia-compression.workspace = true
utopia-database.workspace = true
utopia-dsn.workspace = true
utopia-http.workspace = true
utopia-image = { workspace = true, features = ["ravif"] }
utopia-lock.workspace = true
utopia-query.workspace = true
utopia-storage.workspace = true
utopia-system.workspace = true
utopia-validators.workspace = true
