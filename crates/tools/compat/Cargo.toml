[package]
name = "compat"
description = "Differential compatibility tester for the PHP and Rust Utopia libraries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "compat"
path = "src/bin/compat.rs"

[[bin]]
name = "compat-driver"
path = "src/bin/compat-driver.rs"

[dependencies]
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
httparse.workspace = true
indexmap.workspace = true
mimalloc.workspace = true
p256 = { workspace = true, features = ["pem"] }
proc-macro2.workspace = true
quote.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "rt", "macros"] }

# Libraries under test (one adapter each in src/libs).
php-std.workspace = true
utopia-abuse = { workspace = true, features = ["redis-cluster"] }
utopia-auth.workspace = true
utopia-cache = { workspace = true, features = ["memcached", "redis-cluster"] }
utopia-database.workspace = true
utopia-domains.workspace = true
utopia-dsn.workspace = true
utopia-config.workspace = true
utopia-span.workspace = true
utopia-di.workspace = true
utopia-registry.workspace = true
utopia-emails.workspace = true
utopia-http.workspace = true
utopia-locale.workspace = true
utopia-lock.workspace = true
utopia-queue.workspace = true
async-nats.workspace = true
utopia-system.workspace = true
utopia-user-agent.workspace = true
utopia-telemetry = { workspace = true, features = ["otlp"] }
utopia-pools.workspace = true
utopia-circuit-breaker = { workspace = true, features = ["redis"] }
utopia-validators.workspace = true
utopia-bus.workspace = true
utopia-cli.workspace = true
utopia-console.workspace = true
utopia-platform.workspace = true
utopia-servers.workspace = true
