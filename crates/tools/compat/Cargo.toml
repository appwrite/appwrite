[package]
name = "compat"
description = "Differential compatibility tester for the PHP and Rust Utopia libraries."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "compat"
path = "src/bin/compat.rs"

[[bin]]
name = "compat-driver"
path = "src/bin/compat-driver.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util.workspace = true
gif.workspace = true
httparse.workspace = true
image.workspace = true
image-webp.workspace = true
indexmap.workspace = true
chrono.workspace = true
mimalloc.workspace = true
libc.workspace = true
p256 = { workspace = true, features = ["pem"] }
proc-macro2.workspace = true
quote.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "rt", "macros"] }
# A WebSocket client for the mqtt cases' MQTT-over-WebSocket steps.
tokio-tungstenite.workspace = true
# The runner snapshots PostgreSQL schemas (`postgres@<service>`).
tokio-postgres.workspace = true
# The runner snapshots SQLite database files (`sqlite`).
rusqlite.workspace = true
# ... and MariaDB/MySQL databases (`mysql@<service>`).
mysql_async.workspace = true
# And MongoDB databases (`mongo@<service>`), with the official driver.
mongodb.workspace = true
# Verifies the JWTs the messaging adapters sign, with the fixture keys.
openssl.workspace = true

# Libraries under test (one adapter each in src/libs).
php-std.workspace = true
utopia-abuse = { workspace = true, features = ["redis-cluster"] }
utopia-agents.workspace = true
utopia-audit.workspace = true
utopia-auth.workspace = true
utopia-balancer.workspace = true
utopia-cache = { workspace = true, features = ["memcached", "redis-cluster"] }
utopia-compression.workspace = true
utopia-database = { workspace = true, features = ["memory", "mongo", "mysql", "pool", "redis", "sqlite"] }
utopia-detector.workspace = true
utopia-domains.workspace = true
utopia-dsn.workspace = true
utopia-config.workspace = true
utopia-span.workspace = true
utopia-storage.workspace = true
utopia-di.workspace = true
utopia-dns.workspace = true
utopia-registry.workspace = true
utopia-schedule.workspace = true
utopia-emails.workspace = true
utopia-http.workspace = true
utopia-image.workspace = true
utopia-locale.workspace = true
utopia-mongo.workspace = true
utopia-lock.workspace = true
utopia-messaging.workspace = true
utopia-openapi.workspace = true
utopia-nats.workspace = true
utopia-mqtt.workspace = true
utopia-queue.workspace = true
async-nats.workspace = true
utopia-system.workspace = true
utopia-user-agent.workspace = true
utopia-telemetry = { workspace = true, features = ["otlp"] }
utopia-pools.workspace = true
utopia-psr7.workspace = true
utopia-circuit-breaker = { workspace = true, features = ["redis"] }
utopia-client.workspace = true
utopia-smtp.workspace = true
utopia-validators.workspace = true
utopia-websocket.workspace = true
http.workspace = true
utopia-bus.workspace = true
utopia-cli.workspace = true
utopia-console.workspace = true
utopia-platform.workspace = true
utopia-servers.workspace = true
utopia-orchestration.workspace = true
utopia-cdn.workspace = true
utopia-query.workspace = true
