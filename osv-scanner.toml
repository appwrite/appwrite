[[IgnoredVulns]]
id = "RUSTSEC-2024-0436"
reason = "paste is unmaintained, not vulnerable. It is a proc-macro, so it runs only at compile time and nothing of it ships; it is reached only through rav1e (AVIF encoding in utopia-image's default `ravif` feature, which the PHP extension does not build), whose latest release still depends on it."

[[IgnoredVulns]]
id = "RUSTSEC-2024-0449"
reason = "unsafe-libyaml is unmaintained (archived), not reported vulnerable. php-std's yaml_parse must reproduce PHP's ext-yaml, which is libyaml, quirks included; the suggested safe-Rust parsers (saphyr, noyalib) parse differently. The fuzz profiles keep away from the one input shape where ext-yaml itself corrupts its heap. Replacing it with the vendored C libyaml (as php-std vendors PCRE2) removes this entry."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0543"
reason = "chrono is unmaintained, not reported vulnerable: the advisory has no fixed version and reports no flaw. It is reached through tokio-postgres's with-chrono-0_4 feature and the workspace's datetime handling; moving to jiff or time is a separate change."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0544"
reason = "The overflow is in zlib's gz_vacate(), reached only through the gzFile API (gzwrite, gzprintf, gzvprintf on a non-blocking stream). utopia-compression and utopia-http call deflate and inflate only, never the gzFile functions. libz-sys stays on zlib 1.3.2, the version PHP's ext-zlib links, because the fixed release bundles zlib 1.4 and gzdeflate()/gzencode() output must match PHP byte for byte."

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
reason = "picomatch has no fixed release (4.0.7 is the latest and the last affected). In apps/crates and apps/compat it is a build-time dependency of Vite and TanStack Start's router plugins, matching glob patterns from the apps' own config, never user input, so the ReDoS on crafted extglobs cannot be reached. Remove this entry when a fixed picomatch ships."
