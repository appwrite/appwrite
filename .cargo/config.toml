# The SQLite library rusqlite builds in (utopia-database's SQLite adapter) gets
# the compile options of the SQLite PHP's pdo_sqlite links in the dev image
# (`PRAGMA compile_options`): math functions (`POWER`, `LN`), 250000 bound
# parameters, recursive triggers, secure delete, and no foreign keys by default;
# and, as its configure script finds, fdatasync() for syncs on Linux (macOS
# syncs with F_FULLFSYNC either way).
[env]
LIBSQLITE3_FLAGS = "SQLITE_ENABLE_MATH_FUNCTIONS SQLITE_MAX_VARIABLE_NUMBER=250000 SQLITE_DEFAULT_RECURSIVE_TRIGGERS SQLITE_SECURE_DELETE -USQLITE_DEFAULT_FOREIGN_KEYS -DHAVE_FDATASYNC=1"

# AES-GCM (the `encrypt` attribute filter, shared with PHP's OpenSSL) uses the
# ARMv8 AES and PMULL instructions only behind these flags; without them ARM
# hosts (Graviton, Apple silicon and the Linux VMs on it) run the constant-time
# software fallback, several times slower. Both detect the instructions at
# runtime and fall back when they are missing.
[target.'cfg(target_arch = "aarch64")']
rustflags = ["--cfg", "aes_armv8", "--cfg", "polyval_armv8"]

# The utopia PHP extension (crates/extension) leaves PHP's symbols for the
# `php` binary that loads it to resolve; macOS's linker needs telling.
[target.'cfg(target_os = "macos")']
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

# rustup's musl targets link statically by default, and a static target cannot
# produce the shared library PHP loads (Alpine, the base image).
[target.'cfg(target_env = "musl")']
rustflags = ["-C", "target-feature=-crt-static"]
